<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Арена Спутников — Ксеноджунгли</title><style>html,body,#game{margin:0;width:100%;height:100%;overflow:hidden;background:#050b09}body{font-family:Arial,sans-serif}canvas{display:block}</style><script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script></head><body><div id="game"></div><script>
const W=3400,H=2200;
const ENEMIES=[
 {key:'alienGreen',name:'Бегун',hp:55,speed:135,tint:0xffffff,scale:.8},
 {key:'alienPink',name:'Плевун',hp:85,speed:82,tint:0xffffff,scale:.85,ranged:true},
 {key:'robot',name:'Дрон',hp:95,speed:105,tint:0x9fe7ff,scale:.8,ranged:true},
 {key:'alienYellow',name:'Громила',hp:210,speed:52,tint:0xffffff,scale:1.15},
 {key:'alienBeige',name:'Призыватель',hp:125,speed:68,tint:0xe8b6ff,scale:.95,ranged:true}
];
class World1 extends Phaser.Scene{
 preload(){
  const r='https://raw.githubusercontent.com/ETdoFresh/kenney.nl/master/';
  this.load.image('hero',r+'topdown-shooter/PNG/Man%20Blue/manBlue_machine.png');
  this.load.image('robot',r+'topdown-shooter/PNG/Robot%201/robot1_machine.png');
  this.load.image('alienGreen',r+'moreenemiesanimations/Alien%20sprites/alienGreen_stand.png');
  this.load.image('alienPink',r+'moreenemiesanimations/Alien%20sprites/alienPink_stand.png');
  this.load.image('alienYellow',r+'moreenemiesanimations/Alien%20sprites/alienYellow_stand.png');
  this.load.image('alienBeige',r+'moreenemiesanimations/Alien%20sprites/alienBeige_stand.png');
  this.load.image('pet',r+'alien-ufo-pack/PNG/dome.png');
  this.load.image('shot',r+'alien-ufo-pack/PNG/laserBlue2.png');
  this.load.image('enemyShot',r+'alien-ufo-pack/PNG/laserGreen2.png');
 }
 create(){
  this.cameras.main.setBackgroundColor('#08140f');this.physics.world.setBounds(0,0,W,H);this.drawWorld();
  this.enemies=this.physics.add.group();this.bullets=this.physics.add.group();this.enemyBullets=this.physics.add.group();
  this.player=this.physics.add.sprite(W/2,H/2,'hero').setScale(1.05).setDepth(30).setCollideWorldBounds(true);this.player.body.setCircle(28,18,18);
  this.playerShadow=this.add.ellipse(this.player.x,this.player.y+34,70,24,0x000000,.42).setDepth(22);
  this.pet=this.physics.add.sprite(this.player.x-80,this.player.y+70,'pet').setScale(.72).setTint(0x7afff0).setDepth(28);
  this.petGlow=this.add.circle(this.pet.x,this.pet.y,42,0x5ffff0,.12).setDepth(20);
  this.keys=this.input.keyboard.addKeys('W,A,S,D');this.cameras.main.startFollow(this.player,true,.08,.08);this.cameras.main.setZoom(1.12);
  this.hp=140;this.maxHp=140;this.level=1;this.xp=0;this.crystals=0;this.lastShot=0;this.lastEnemyVolley=0;this.boss=null;this.bossSpawned=false;
  for(let i=0;i<24;i++)this.spawnEnemy(i%5,false);
  this.physics.add.overlap(this.bullets,this.enemies,(b,e)=>this.hitEnemy(b,e));
  this.physics.add.overlap(this.player,this.enemies,(_,e)=>this.hurt(e.boss?22:10));
  this.physics.add.overlap(this.player,this.enemyBullets,(_,b)=>{b.destroy();this.hurt(12)});
  this.makeHud();this.time.addEvent({delay:7000,loop:true,callback:()=>this.spawnWave()});this.time.delayedCall(42000,()=>this.spawnBoss());
 }
 drawWorld(){
  const g=this.add.graphics().setDepth(-50);g.fillStyle(0x081c15,1).fillRect(0,0,W,H);
  for(let i=0;i<900;i++){const x=Phaser.Math.Between(0,W),y=Phaser.Math.Between(0,H),r=Phaser.Math.Between(2,15);g.fillStyle(Phaser.Math.RND.pick([0x123524,0x173f2a,0x0d2b22,0x264630]),Phaser.Math.FloatBetween(.25,.65)).fillCircle(x,y,r)}
  for(let i=0;i<120;i++){const x=Phaser.Math.Between(50,W-50),y=Phaser.Math.Between(50,H-50),r=Phaser.Math.Between(24,55);g.fillStyle(0x020605,.4).fillEllipse(x+10,y+18,r*1.7,r*.65);g.fillStyle(Phaser.Math.RND.pick([0x246b3c,0x2e7f48,0x3f8c55]),.95).fillCircle(x,y,r);g.fillStyle(0x7bdc83,.3).fillCircle(x-r*.25,y-r*.25,r*.55)}
  for(let i=0;i<55;i++){const x=Phaser.Math.Between(100,W-100),y=Phaser.Math.Between(100,H-100),s=Phaser.Math.Between(18,40);g.fillStyle(0x5ffff0,.07).fillCircle(x,y,s*1.8);g.fillStyle(0x62e8ff,.88).fillTriangle(x,y-s,x-s*.42,y+s*.7,x+s*.42,y+s*.7);g.fillStyle(0xeaffff,.7).fillTriangle(x+2,y-s*.72,x-4,y+s*.2,x+8,y+s*.1)}
  for(let i=0;i<26;i++){const x=Phaser.Math.Between(120,W-120),y=Phaser.Math.Between(120,H-120),rw=Phaser.Math.Between(70,150),rh=Phaser.Math.Between(30,65);g.fillStyle(0x000000,.3).fillRoundedRect(x-rw/2+8,y-rh/2+10,rw,rh,8);g.fillStyle(0x3d514a,.92).fillRoundedRect(x-rw/2,y-rh/2,rw,rh,8);g.lineStyle(3,0x78b895,.45).strokeRoundedRect(x-rw/2,y-rh/2,rw,rh,8)}
 }
 makeHud(){
  this.panel=this.add.rectangle(18,18,400,112,0x06100d,.88).setOrigin(0).setScrollFactor(0).setDepth(200).setStrokeStyle(2,0x4f9e7a,.65);
  this.hpBg=this.add.rectangle(36,42,285,18,0x251515,1).setOrigin(0,.5).setScrollFactor(0).setDepth(201);this.hpBar=this.add.rectangle(36,42,285,18,0x5bed90,1).setOrigin(0,.5).setScrollFactor(0).setDepth(202);
  this.hud=this.add.text(36,62,'',{fontFamily:'Arial',fontSize:'17px',fontStyle:'bold',color:'#effff6',lineSpacing:5}).setScrollFactor(0).setDepth(203);
  this.title=this.add.text(this.scale.width/2,22,'КСЕНОДЖУНГЛИ',{fontFamily:'Arial',fontSize:'28px',fontStyle:'bold',color:'#c9ffe4',stroke:'#03100b',strokeThickness:7}).setOrigin(.5,0).setScrollFactor(0).setDepth(203);
  this.tip=this.add.text(this.scale.width/2,60,'WASD • автострельба',{fontFamily:'Arial',fontSize:'15px',fontStyle:'bold',color:'#83e6be',backgroundColor:'#0b2119',padding:{x:10,y:5}}).setOrigin(.5,0).setScrollFactor(0).setDepth(203);this.updateHud();
 }
 spawnWave(){for(let i=0;i<6+Math.min(8,this.level);i++)this.time.delayedCall(i*110,()=>this.spawnEnemy(Phaser.Math.Between(0,4),true))}
 spawnEnemy(type,around){const d=Phaser.Math.Between(520,850),a=Phaser.Math.FloatBetween(0,Math.PI*2),cx=around?this.player.x:W/2,cy=around?this.player.y:H/2,x=Phaser.Math.Clamp(cx+Math.cos(a)*d,70,W-70),y=Phaser.Math.Clamp(cy+Math.sin(a)*d,70,H-70),cfg=ENEMIES[type],e=this.enemies.create(x,y,cfg.key).setScale(cfg.scale).setTint(cfg.tint).setDepth(26);e.type=type;e.maxHp=cfg.hp;e.hp=cfg.hp;e.speed=cfg.speed;e.ranged=cfg.ranged;e.lastAttack=Phaser.Math.Between(0,1300);e.shadow=this.add.ellipse(x,y+28,type===3?72:48,type===3?25:17,0x000000,.35).setDepth(21);e.label=this.add.text(x,y-50,cfg.name,{fontFamily:'Arial',fontSize:'11px',fontStyle:'bold',color:'#dffff3',stroke:'#03100b',strokeThickness:3}).setOrigin(.5).setDepth(29);return e}
 spawnBoss(){if(this.bossSpawned)return;this.bossSpawned=true;const e=this.enemies.create(Phaser.Math.Clamp(this.player.x+650,120,W-120),this.player.y,'alienPink').setScale(3.1).setTint(0xff8fd6).setDepth(31);e.boss=true;e.maxHp=2600;e.hp=2600;e.speed=42;e.lastAttack=0;e.shadow=this.add.ellipse(e.x,e.y+85,210,70,0x000000,.5).setDepth(23);e.aura=this.add.circle(e.x,e.y,125,0xbb48ff,.12).setDepth(24);e.label=this.add.text(e.x,e.y-135,'КОРОЛЕВА КСЕНО',{fontFamily:'Arial',fontSize:'20px',fontStyle:'bold',color:'#ffb4ef',stroke:'#17051d',strokeThickness:5}).setOrigin(.5).setDepth(34);this.boss=e;this.title.setText('⚠ КОРОЛЕВА КСЕНО ⚠').setColor('#ff9ee6');this.cameras.main.flash(400,120,20,120);this.cameras.main.shake(400,.012)}
 update(t){if(!this.player)return;let mx=(this.keys.D.isDown?1:0)-(this.keys.A.isDown?1:0),my=(this.keys.S.isDown?1:0)-(this.keys.W.isDown?1:0),v=new Phaser.Math.Vector2(mx,my);if(v.lengthSq())v.normalize().scale(250);this.player.setVelocity(v.x,v.y);this.playerShadow.setPosition(this.player.x,this.player.y+34);let pt=new Phaser.Math.Vector2(this.player.x-75,this.player.y+65);this.pet.x=Phaser.Math.Linear(this.pet.x,pt.x,.08);this.pet.y=Phaser.Math.Linear(this.pet.y,pt.y,.08);this.petGlow.setPosition(this.pet.x,this.pet.y);this.pet.rotation+=.01;
  let target=null,nearest=1e9;this.enemies.children.iterate(e=>{if(!e||!e.active)return;const d=Phaser.Math.Distance.Between(this.player.x,this.player.y,e.x,e.y);if(d<nearest){nearest=d;target=e}if(e.ranged&&!e.boss&&d<360){e.setVelocity(0,0);if(t>e.lastAttack+1500){e.lastAttack=t;this.enemyFire(e)}}else this.physics.moveToObject(e,this.player,e.speed);if(e.shadow)e.shadow.setPosition(e.x,e.y+(e.boss?85:28));if(e.label)e.label.setPosition(e.x,e.y-(e.boss?135:50));if(e.aura)e.aura.setPosition(e.x,e.y);if(e.boss&&t>e.lastAttack+1200){e.lastAttack=t;for(let i=0;i<8;i++)this.enemyFire(e,i*Math.PI/4,true)}});
  if(target&&t>this.lastShot+230){this.lastShot=t;this.fire(target)}
 }
 fire(target){const b=this.bullets.create(this.player.x,this.player.y,'shot').setScale(.55).setTint(0x8ffff2).setDepth(40);b.damage=34;b.rotation=Math.atan2(target.y-this.player.y,target.x-this.player.x)+Math.PI/2;this.physics.moveToObject(b,target,760);this.time.delayedCall(1200,()=>b.active&&b.destroy());const f=this.add.circle(this.player.x,this.player.y,22,0x74fff0,.35).setDepth(35);this.tweens.add({targets:f,scale:1.7,alpha:0,duration:120,onComplete:()=>f.destroy()})}
 enemyFire(e,ang=null,radial=false){const b=this.enemyBullets.create(e.x,e.y,'enemyShot').setScale(.5).setTint(e.boss?0xff6bd7:0x7dff6b).setDepth(38);const a=radial?ang:Math.atan2(this.player.y-e.y,this.player.x-e.x);b.rotation=a+Math.PI/2;b.setVelocity(Math.cos(a)*(e.boss?360:270),Math.sin(a)*(e.boss?360:270));this.time.delayedCall(1800,()=>b.active&&b.destroy())}
 hitEnemy(b,e){if(!e.active)return;const dmg=b.damage||34;b.destroy();e.hp-=dmg;e.setAlpha(.35);this.time.delayedCall(70,()=>e.active&&e.setAlpha(1));const n=this.add.text(e.x,e.y-34,String(dmg),{fontFamily:'Arial',fontSize:'20px',fontStyle:'bold',color:'#fff7a8',stroke:'#161006',strokeThickness:4}).setOrigin(.5).setDepth(50);this.tweens.add({targets:n,y:n.y-35,alpha:0,duration:420,onComplete:()=>n.destroy()});if(e.hp<=0)this.killEnemy(e)}
 killEnemy(e){const x=e.x,y=e.y;if(e.shadow)e.shadow.destroy();if(e.label)e.label.destroy();if(e.aura)e.aura.destroy();if(e===this.boss){this.title.setText('МИР 1 ПРОЙДЕН').setColor('#9effc5');this.boss=null}e.destroy();this.xp+=14;this.crystals+=Phaser.Math.Between(0,2);for(let i=0;i<10;i++){const p=this.add.circle(x,y,Phaser.Math.Between(2,6),Phaser.Math.RND.pick([0x72ffd7,0xff8de8,0xffc96e]),.95).setDepth(45);this.tweens.add({targets:p,x:x+Phaser.Math.Between(-70,70),y:y+Phaser.Math.Between(-70,70),alpha:0,duration:420,onComplete:()=>p.destroy()})}if(this.xp>=this.level*100){this.xp=0;this.level++;this.cameras.main.flash(180,70,255,170)}this.updateHud();this.time.delayedCall(700,()=>this.spawnEnemy(Phaser.Math.Between(0,4),true))}
 hurt(d){if(this.time.now<(this.hurtUntil||0))return;this.hurtUntil=this.time.now+650;this.hp=Math.max(0,this.hp-d);this.player.setTint(0xff8e8e);this.time.delayedCall(100,()=>this.player.active&&this.player.clearTint());this.cameras.main.shake(120,.008);if(this.hp<=0)this.title.setText('ПОРАЖЕНИЕ').setColor('#ff7777');this.updateHud()}
 updateHud(){if(!this.hud)return;this.hpBar.width=285*(this.hp/this.maxHp);this.hud.setText(`HP ${this.hp}/${this.maxHp}\nУРОВЕНЬ ${this.level}   XP ${this.xp}/${this.level*100}\nКРИСТАЛЛЫ ◆ ${this.crystals}`)}
}
new Phaser.Game({type:Phaser.WEBGL,parent:'game',width:1280,height:720,backgroundColor:'#08140f',physics:{default:'arcade',arcade:{debug:false}},scale:{mode:Phaser.Scale.RESIZE,autoCenter:Phaser.Scale.CENTER_BOTH},render:{antialias:true,pixelArt:false},scene:World1});
</script></body></html>
