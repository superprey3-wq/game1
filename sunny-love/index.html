<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff4f8">
<title>Для тебя 💗</title>
<style>
:root{--pink:#ff6fae;--pink2:#ff9cc7;--ink:#5a3b4c;--soft:#fff7fa;--sun:#ffd65c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 20% 10%,#fff8dd 0,transparent 30%),radial-gradient(circle at 80% 20%,#ffe0ee 0,transparent 34%),linear-gradient(160deg,#fff8fb,#fff4f8 60%,#fffaf0);color:var(--ink)}
body{min-height:100svh;overflow:hidden}.page{min-height:100svh;display:grid;place-items:center;padding:24px;position:relative}.glow{position:absolute;width:320px;height:320px;border-radius:50%;background:rgba(255,214,92,.18);filter:blur(34px);top:-100px;right:-80px}.card{width:min(560px,100%);padding:34px 24px 28px;border-radius:32px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9);box-shadow:0 24px 70px rgba(125,68,96,.14);backdrop-filter:blur(18px);text-align:center;position:relative;z-index:2}.tiny{font-size:.82rem;letter-spacing:.18em;text-transform:uppercase;color:#a9798f;font-weight:800}.heartWrap{height:170px;display:grid;place-items:center}.heart{font-size:92px;filter:drop-shadow(0 15px 25px rgba(255,87,151,.22));animation:beat 1.25s ease-in-out infinite;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}.heart:active{transform:scale(.9)}h1{font-size:clamp(2rem,8vw,3.6rem);line-height:1;margin:0 0 14px}.sun{display:inline-block;animation:float 2.8s ease-in-out infinite}.lead{font-size:1.06rem;line-height:1.65;color:#76576a;margin:0 auto 22px;max-width:430px}.note{min-height:72px;margin:18px 0 20px;padding:18px;border-radius:22px;background:#fff9fc;border:1px solid #ffe2ef;font-size:1.05rem;line-height:1.55;display:grid;place-items:center}.btn{border:0;border-radius:18px;padding:15px 20px;font-size:1rem;font-weight:800;background:linear-gradient(135deg,var(--pink),var(--pink2));color:white;box-shadow:0 12px 26px rgba(255,111,174,.26);cursor:pointer}.btn:active{transform:translateY(1px) scale(.99)}.hint{margin-top:14px;font-size:.82rem;color:#aa8a9a}.floatHeart{position:fixed;left:0;top:0;pointer-events:none;z-index:10;font-size:22px;animation:fly 1.8s ease-out forwards}.stars{position:absolute;inset:0;overflow:hidden;pointer-events:none}.star{position:absolute;opacity:.5;animation:twinkle 3s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.09)}30%{transform:scale(1)}45%{transform:scale(1.06)}60%{transform:scale(1)}}@keyframes float{50%{transform:translateY(-6px) rotate(4deg)}}@keyframes fly{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}15%{opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% - 180px)) rotate(var(--r)) scale(1.4);opacity:0}}@keyframes twinkle{0%,100%{transform:scale(.8);opacity:.25}50%{transform:scale(1.25);opacity:.8}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="page">
  <div class="glow"></div>
  <div class="stars" aria-hidden="true">
    <span class="star" style="left:9%;top:12%;animation-delay:.2s">✨</span><span class="star" style="left:82%;top:16%;animation-delay:1s">✦</span><span class="star" style="left:14%;top:78%;animation-delay:1.7s">♡</span><span class="star" style="left:86%;top:74%;animation-delay:.7s">✨</span><span class="star" style="left:48%;top:7%;animation-delay:2.2s">✧</span>
  </div>
  <main class="card">
    <div class="tiny">маленькое напоминание для тебя</div>
    <div class="heartWrap"><div id="heart" class="heart" aria-label="Сердечко">💗</div></div>
    <h1>Ты моё солнышко <span class="sun">☀️</span></h1>
    <p class="lead">Просто хотел напомнить: ты делаешь мои обычные дни теплее. И да — эта страничка существует только ради твоей улыбки.</p>
    <div id="note" class="note">Нажми на кнопку, там ещё кое-что для тебя 💌</div>
    <button id="more" class="btn">Открыть милую записку</button>
    <div class="hint">P.S. на сердечко тоже можно нажимать</div>
  </main>
</div>
<script>
const notes=[
 'Мне очень нравится, что именно ты есть в моей жизни 💞',
 'Если день вдруг станет тяжёлым — помни: где-то есть человек, который думает о тебе и улыбается.',
 'Ты умеешь делать даже обычные разговоры особенными.',
 'Мне с тобой уютно даже через километры.',
 'У тебя официально есть суперсила — делать мой день лучше одним сообщением.',
 'Ты заслуживаешь сегодня что-нибудь вкусное. Это не обсуждается 😌',
 'На всякий случай: ты очень красивая. Да, именно сейчас тоже.',
 'Спасибо, что ты — это ты. Мне очень повезло встретить тебя.',
 'Если бы можно было отправить объятие ссылкой, оно было бы прямо здесь 🤍',
 'И последнее: я всё равно выбрал бы тебя. Снова и снова.'
];
let i=0;
const note=document.getElementById('note'),btn=document.getElementById('more'),heart=document.getElementById('heart');
function burst(cx,cy,count=10){for(let n=0;n<count;n++){const e=document.createElement('span');e.className='floatHeart';e.textContent=['💗','💕','💖','🤍'][Math.floor(Math.random()*4)];e.style.left=cx+'px';e.style.top=cy+'px';e.style.setProperty('--x',((Math.random()-.5)*170)+'px');e.style.setProperty('--r',((Math.random()-.5)*70)+'deg');e.style.animationDelay=(Math.random()*.12)+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),2100)}}
btn.addEventListener('click',e=>{note.textContent=notes[i%notes.length];i++;btn.textContent=i>=notes.length?'Ещё раз 💗':'Ещё записка';const r=btn.getBoundingClientRect();burst(r.left+r.width/2,r.top,7)});
heart.addEventListener('click',e=>{const r=heart.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,14)});
setTimeout(()=>{const r=heart.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,8)},650);
</script>
</body>
</html>
