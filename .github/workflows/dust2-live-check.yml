name: Dust2 Live Endpoint Check

on:
  push:
    branches:
      - dust2-1v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check health and mobile assets
        shell: bash
        run: |
          set -euo pipefail
          base="https://dust2-1v1.onrender.com"
          echo "== HEALTH =="
          curl -fSsL --max-time 90 -D /tmp/health.headers "$base/health" -o /tmp/health.json
          cat /tmp/health.headers
          cat /tmp/health.json
          echo
          echo "== MANIFEST =="
          curl -fSsL --max-time 90 -D /tmp/manifest.headers "$base/assets/asset-manifest-mobile.json" -o /tmp/manifest.json
          cat /tmp/manifest.headers
          python - <<'PY'
          import json
          m=json.load(open('/tmp/manifest.json'))
          print('files',len(m['files']),'bytes',m['totalBytes'])
          for f in m['files'][:5]:
              print(f['path'],f['bytes'],f['sha256'])
          PY
          echo "== FIRST FIVE ASSETS =="
          python - <<'PY' >/tmp/paths.txt
          import json
          m=json.load(open('/tmp/manifest.json'))
          for f in m['files'][:5]:
              print(f["path"])
          PY
          while IFS= read -r p; do
            echo "-- $p"
            curl -fSsL --max-time 120 -D /tmp/a.headers "$base/$p" -o /tmp/a.bin
            wc -c /tmp/a.bin
            grep -Ei 'HTTP/|content-type|content-length|cache-control|location' /tmp/a.headers || true
          done </tmp/paths.txt
          echo "== SCENE STARTUP ASSETS =="
          for p in             assets/map-mobile/dust2-clear.gltf             assets/map/positions.f32             assets/sky/daylight.hdr             assets/viewmodel/animations.glb             assets/characters-cs2/arms/ct-sas.glb             assets/characters-cs2/ct-sas.glb             assets/weapons/cs2-loadout/m4a1-printstream.glb             assets/weapons/cs2-loadout/usp-kill-confirmed.glb             assets/weapons/cs2-loadout/karambit-sapphire.glb
          do
            echo "-- $p"
            curl -fSsL --max-time 180 -w "status=%{http_code} bytes=%{size_download} time=%{time_total}\n" "$base/$p" -o /tmp/scene.bin
            test -s /tmp/scene.bin
          done
