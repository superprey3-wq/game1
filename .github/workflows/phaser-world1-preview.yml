name: Build Phaser World 1 Preview
on:
  push:
    branches: [phaser-rebuild]
    paths: ['phaser/**','.github/workflows/phaser-world1-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: phaser-world1-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: phaser/package-lock.json}
      - name: Install and build
        working-directory: phaser
        run: npm install && npm run build -- --base=/game1/world1/
      - name: Assemble preview site
        run: |
          git worktree add --detach _main origin/main
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='UnityProject' --exclude='phaser' _main/ _site/
          rm -rf _site/world1 && mkdir -p _site/world1
          cp -R phaser/dist/. _site/world1/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}world1/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
