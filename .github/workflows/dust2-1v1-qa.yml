name: Dust2 1v1 QA

on:
  push:
    branches:
      - dust2-1v1
  workflow_dispatch:

concurrency:
  group: dust2-1v1-qa
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dust2-1v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: node --test tests/one-v-one.mjs
      - run: npm run build:render
