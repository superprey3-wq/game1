name: Dust2 1v1 QA

on:
  push:
    branches:
      - dust2-1v1
  workflow_dispatch:

concurrency:
  group: dust2-1v1-qa
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dust2-1v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: public/assets
          key: dust2-assets-${{ hashFiles('config/assets-lock.json') }}
      - run: npm run assets:fetch
      - run: npm test
      - run: npm run build
