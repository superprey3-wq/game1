<title>Skybound Frog — Pixel Platformer</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f2038;font-family:Arial,Helvetica,sans-serif;touch-action:none}body{display:flex;align-items:center;justify-content:center}canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges;background:#72c8ff}.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#0c1b31bb,#10284be6);z-index:5;color:#fff;padding:22px;text-align:center}.overlay.hidden{display:none}.card{width:min(560px,94vw);padding:26px 22px;border:4px solid #fff;border-radius:20px;background:#173b62;box-shadow:0 12px 0 #0a213c,0 20px 50px #0008}.card h1{margin:0 0 8px;font-size:clamp(30px,7vw,64px);line-height:.95;text-shadow:0 5px 0 #0b2849}.card p{font-weight:700;line-height:1.45;color:#dff4ff}.btn{border:0;border-radius:14px;padding:15px 26px;font-weight:900;font-size:20px;color:#17321f;background:#ffdf4d;box-shadow:0 6px 0 #b17f17;cursor:pointer}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b17f17}.small{font-size:13px;opacity:.86;margin-top:16px}.credits{position:fixed;right:8px;bottom:6px;z-index:4;font-size:10px;color:#fff9;text-shadow:0 1px #000;pointer-events:none}

<body>
<canvas id="game" aria-label="2D платформер"></canvas>
<div id="menu" class="overlay"><div class="card"><h1>SKYBOUND<br>FROG</h1><p>Пиксельный платформер: 3 уровня, пропасти, враги, монеты и разрушаемые блоки.</p><button id="startBtn" class="btn">ИГРАТЬ</button><div class="small">ПК: A/D или ←/→, прыжок W/↑/Пробел · Телефон: экранные кнопки</div></div></div>
<div id="end" class="overlay hidden"><div class="card"><h1 id="endTitle">ПОБЕДА!</h1><p id="endText"></p><button id="restartBtn" class="btn">СНАЧАЛА</button></div></div>

<script>
'use strict';
const cv=document.getElementById('game'),ctx=cv.getContext('2d',{alpha:false});ctx.imageSmoothingEnabled=false;
let W=0,H=0,D=1,last=0,acc=0,camX=0,state='menu',levelIndex=0,lives=3,score=0,coins=0,world=null,player=null,audio=null,ya=null;
const keys={left:false,right:false,jump:false,jumpPressed:false};
const TILE=48,STEP=1/120,GRAV=2200,MAXFALL=1050,RUN=315,ACC=1900,AIRACC=1150,FRICTION=2300,JUMP=-735;
const base='https://raw.githubusercontent.com/marpor/PixelAdventure/main/PixelAdventure/';
const urls={idle:base+'Main%20Characters/Ninja%20Frog/Idle%20(32x32).png',run:base+'Main%20Characters/Ninja%20Frog/Run%20(32x32).png',jump:base+'Main%20Characters/Ninja%20Frog/Jump%20(32x32).png',fall:base+'Main%20Characters/Ninja%20Frog/Fall%20(32x32).png',enemy:base+'Enemies/Mushroom/Run%20(32x32).png',terrain:base+'Terrain/Terrain%20(16x16).png',collectible:base+'Items/Fruits/Orange.png',bg1:base+'Background/Blue.png',bg2:base+'Background/Green.png',bg3:base+'Background/Purple.png'};
const A={};let assetsReady=0;for(const [k,u] of Object.entries(urls)){const im=new Image();im.crossOrigin='anonymous';im.onload=()=>assetsReady++;im.onerror=()=>assetsReady++;im.src=u;A[k]=im}
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0);ctx.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function rects(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function snd(type){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);let f=type==='jump'?420:type==='coin'?950:type==='stomp'?180:type==='hurt'?110:70;o.type=type==='coin'?'square':'triangle';o.frequency.setValueAtTime(f,audio.currentTime);if(type==='coin')o.frequency.exponentialRampToValueAtTime(1450,audio.currentTime+.08);if(type==='jump')o.frequency.exponentialRampToValueAtTime(650,audio.currentTime+.11);g.gain.setValueAtTime(.08,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.18);o.start();o.stop(audio.currentTime+.19)}catch(e){}}
async function initYandex(){try{if(window.YaGames){ya=await YaGames.init();if(ya&&ya.features&&ya.features.LoadingAPI)ya.features.LoadingAPI.ready()}}catch(e){ya=null}}initYandex();
const levels=[
{title:'1-1 СОЛНЕЧНЫЕ ХОЛМЫ',theme:'bg1',length:4200,start:[140,430],goal:4050,solids:[[0,520,760,180],[930,520,650,180],[1780,520,800,180],[2780,520,570,180],[3520,520,800,180],[480,390,240,36],[1060,360,200,36],[1420,310,200,36],[1990,390,240,36],[2360,320,180,36],[2920,380,220,36],[3630,350,220,36]],bricks:[[650,300,48,48],[700,300,48,48],[1250,250,48,48],[1300,250,48,48],[2240,270,48,48]],coins:[[530,340],[600,340],[1110,305],[1180,305],[1470,255],[1540,255],[2040,335],[2110,335],[2400,265],[2970,325],[3040,325],[3690,295],[3760,295]],enemies:[[1040,470,70],[1510,470,75],[2070,470,80],[3020,470,90],[3700,300,75]]},
{title:'2-1 ИЗУМРУДНЫЙ КАНЬОН',theme:'bg2',length:4750,start:[120,430],goal:4580,solids:[[0,520,590,180],[780,520,520,180],[1490,520,510,180],[2190,520,370,180],[2780,520,690,180],[3710,520,1050,180],[310,380,190,36],[860,340,190,36],[1140,280,150,36],[1580,390,190,36],[1840,325,160,36],[2270,350,180,36],[2880,360,190,36],[3220,290,160,36],[3830,380,190,36],[4160,310,170,36]],bricks:[[440,290,48,48],[490,290,48,48],[900,245,48,48],[950,245,48,48],[1640,300,48,48],[2960,265,48,48],[3010,265,48,48],[3870,285,48,48]],coins:[[350,325],[420,325],[860,285],[930,285],[1180,225],[1620,335],[1700,335],[1880,270],[2310,295],[2900,305],[3270,235],[3340,235],[3880,325],[3940,325],[4210,255]],enemies:[[860,470,85],[1180,230,70],[1600,470,95],[2320,300,80],[2920,470,105],[3310,240,85],[3890,470,110],[4210,260,90]]},
{title:'3-1 СУМЕРЕЧНЫЕ ВЕРШИНЫ',theme:'bg3',length:5350,start:[110,430],goal:5180,solids:[[0,520,470,180],[680,520,400,180],[1320,520,390,180],[1940,520,300,180],[2500,520,350,180],[3120,520,310,180],[3710,520,520,180],[4500,520,860,180],[260,375,160,34],[735,330,150,34],[980,260,140,34],[1380,370,160,34],[1600,300,140,34],[1980,350,160,34],[2550,350,140,34],[3180,340,150,34],[3770,370,150,34],[4040,300,150,34],[4560,360,150,34],[4850,285,160,34]],bricks:[[300,280,48,48],[790,240,48,48],[840,240,48,48],[1430,275,48,48],[1480,275,48,48],[2030,255,48,48],[2600,260,48,48],[3230,245,48,48],[3820,275,48,48],[4090,205,48,48],[4610,265,48,48]],coins:[[290,320],[760,275],[830,275],[1015,205],[1410,315],[1650,245],[2015,295],[2580,295],[3220,285],[3800,315],[4070,245],[4140,245],[4600,305],[4890,230],[4960,230]],enemies:[[730,470,100],[1000,210,85],[1390,470,110],[1990,300,95],[2580,470,115],[3220,290,100],[3810,470,120],[4060,250,105],[4610,470,125],[4900,235,110]]}
];
function makeWorld(i){const l=levels[i];world={...l,solids:l.solids.map(x=>({x:x[0],y:x[1],w:x[2],h:x[3],type:'ground'})),bricks:l.bricks.map(x=>({x:x[0],y:x[1],w:x[2],h:x[3],type:'brick',dead:false,bump:0})),coins:l.coins.map(x=>({x:x[0],y:x[1],w:30,h:30,t:Math.random()*6,dead:false})),enemies:l.enemies.map(x=>({x:x[0],y:x[1],w:42,h:42,vx:-x[2],vy:0,dead:false,dir:-1,on:false,t:Math.random()*5})),particles:[]};player={x:l.start[0],y:l.start[1],w:42,h:48,vx:0,vy:0,on:false,face:1,coyote:0,jumpBuffer:0,anim:0,inv:0};camX=0;state='play'}
function startGame(){lives=3;score=0;coins=0;levelIndex=0;makeWorld(0);document.getElementById('menu').classList.add('hidden');document.getElementById('end').classList.add('hidden');if(ya&&ya.features&&ya.features.GameplayAPI)try{ya.features.GameplayAPI.start()}catch(e){}}
function loseLife(){if(player.inv>0)return;lives--;snd('hurt');if(lives<=0){finish(false);return}makeWorld(levelIndex)}
function finish(win){state=win?'win':'lose';document.getElementById('end').classList.remove('hidden');document.getElementById('endTitle').textContent=win?'ПОБЕДА!':'ИГРА ОКОНЧЕНА';document.getElementById('endText').textContent=win?`Все 3 уровня пройдены! Монеты: ${coins} · Очки: ${score}`:`Монеты: ${coins} · Очки: ${score}`;if(ya&&ya.features&&ya.features.GameplayAPI)try{ya.features.GameplayAPI.stop()}catch(e){}if(!win)snd('lose')}
function nextLevel(){score+=1000;if(levelIndex>=levels.length-1)finish(true);else{levelIndex++;makeWorld(levelIndex)}}
function allPlatforms(){return world.solids.concat(world.bricks.filter(b=>!b.dead))}
function moveEntity(e,dt){e.x+=e.vx*dt;for(const s of allPlatforms())if(rects(e,s)){if(e.vx>0)e.x=s.x-e.w;else if(e.vx<0)e.x=s.x+s.w;e.vx=0}e.y+=e.vy*dt;e.on=false;for(const s of allPlatforms())if(rects(e,s)){if(e.vy>0){e.y=s.y-e.h;e.vy=0;e.on=true}else if(e.vy<0){e.y=s.y+s.h;e.vy=0;if(e===player&&s.type==='brick'){s.bump=.12;s.dead=true;score+=50;burst(s.x+s.w/2,s.y,'#ffc35a')}}}}
function burst(x,y,c){for(let i=0;i<10;i++)world.particles.push({x,y,vx:(Math.random()-.5)*250,vy:-Math.random()*300,l:.55,c})}
function update(dt){if(state!=='play')return;player.inv=Math.max(0,player.inv-dt);if(keys.jumpPressed){player.jumpBuffer=.13;keys.jumpPressed=false}else player.jumpBuffer=Math.max(0,player.jumpBuffer-dt);player.coyote=player.on?.1:Math.max(0,player.coyote-dt);let dir=(keys.right?1:0)-(keys.left?1:0),accel=player.on?ACC:AIRACC;if(dir){player.vx+=dir*accel*dt;player.vx=clamp(player.vx,-RUN,RUN);player.face=dir}else if(player.on){let d=Math.sign(player.vx),nv=Math.abs(player.vx)-FRICTION*dt;player.vx=d*Math.max(0,nv)}if(player.jumpBuffer>0&&player.coyote>0){player.vy=JUMP;player.on=false;player.coyote=0;player.jumpBuffer=0;snd('jump')}if(!keys.jump&&player.vy<0)player.vy+=GRAV*1.55*dt;player.vy=Math.min(MAXFALL,player.vy+GRAV*dt);moveEntity(player,dt);player.anim+=dt*(Math.abs(player.vx)>.1?12:6);for(const b of world.bricks)b.bump=Math.max(0,b.bump-dt);for(const c of world.coins){if(c.dead)continue;c.t+=dt*7;if(rects(player,{x:c.x-4,y:c.y-4,w:c.w+8,h:c.h+8})){c.dead=true;coins++;score+=100;snd('coin');burst(c.x+15,c.y+15,'#ffe66d')}}for(const e of world.enemies){if(e.dead)continue;e.t+=dt;e.vy=Math.min(MAXFALL,e.vy+GRAV*dt);let oldV=e.vx;e.x+=e.vx*dt;let hit=false;for(const s of allPlatforms())if(rects(e,s)){hit=true;if(e.vx>0)e.x=s.x-e.w;else e.x=s.x+s.w}if(hit){e.vx=-oldV;e.dir=Math.sign(e.vx)}e.y+=e.vy*dt;e.on=false;for(const s of allPlatforms())if(rects(e,s)&&e.vy>=0){e.y=s.y-e.h;e.vy=0;e.on=true;break}if(e.on){const probe={x:e.vx<0?e.x-8:e.x+e.w+2,y:e.y+e.h+4,w:6,h:6};let groundAhead=false;for(const s of allPlatforms())if(rects(probe,s)){groundAhead=true;break}if(!groundAhead){e.vx=-e.vx;e.dir=Math.sign(e.vx)}}if(rects(player,e)){const prevBottom=player.y+player.h-player.vy*dt;if(player.vy>120&&prevBottom<=e.y+12){e.dead=true;player.vy=-430;score+=250;snd('stomp');burst(e.x+e.w/2,e.y+e.h/2,'#9cff8d')}else if(player.inv<=0){player.inv=1.15;player.vy=-420;player.vx=-player.face*220;lives--;snd('hurt');if(lives<=0){finish(false);return}}}if(e.y>H+800)e.dead=true}for(const p of world.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=900*dt;p.l-=dt}world.particles=world.particles.filter(p=>p.l>0);if(player.y>900){loseLife();return}if(player.x>world.goal)nextLevel();camX+=(clamp(player.x-W*.35,0,Math.max(0,world.length-W))-camX)*Math.min(1,dt*6)}
function drawSpriteSheet(im,frame,fw,fh,x,y,w,h,flip=false){if(!im.complete||!im.naturalWidth)return;const cols=Math.max(1,Math.floor(im.naturalWidth/fw)),total=Math.max(1,cols*Math.floor(im.naturalHeight/fh)),f=((frame%total)+total)%total,sx=(f%cols)*fw,sy=Math.floor(f/cols)*fh;ctx.save();ctx.translate(x+(flip?w:0),y);ctx.scale(flip?-1:1,1);ctx.drawImage(im,sx,sy,fw,fh,0,0,w,h);ctx.restore()}
function tileCrop(x,y,kind='ground'){const im=A.terrain;if(!im.complete||!im.naturalWidth)return;const sx=kind==='brick'?16:96,sy=kind==='brick'?16:0;ctx.drawImage(im,sx,sy,16,16,x,y,TILE,TILE)}
function drawBackground(){const im=A[world?world.theme:'bg1'];ctx.fillStyle=levelIndex===2?'#2d315f':levelIndex===1?'#55bd8b':'#77cfff';ctx.fillRect(0,0,W,H);if(im.complete&&im.naturalWidth){const s=4,w=im.naturalWidth*s,h=im.naturalHeight*s;for(let x=-(camX*.12)%w-w;x<W+w;x+=w)for(let y=0;y<H;y+=h)ctx.drawImage(im,x,y,w,h)}}
function drawWorld(){drawBackground();ctx.save();ctx.translate(-camX,0);for(const s of world.solids)for(let y=s.y;y<s.y+s.h;y+=TILE)for(let x=s.x;x<s.x+s.w;x+=TILE)tileCrop(x,y,'ground');for(const b of world.bricks){if(b.dead)continue;let by=b.y-(b.bump>0?Math.sin((.12-b.bump)/.12*Math.PI)*10:0);tileCrop(b.x,by,'brick')}for(const c of world.coins){if(c.dead)continue;const frames=Math.max(1,Math.floor((A.collectible.naturalWidth||32)/32)),f=Math.floor(c.t)%frames;ctx.save();const wob=.72+.28*Math.abs(Math.sin(c.t));ctx.translate(c.x+15,c.y+15);ctx.scale(wob,1);drawSpriteSheet(A.collectible,f,32,32,-18,-18,36,36,false);ctx.restore()}for(const e of world.enemies){if(e.dead)continue;drawSpriteSheet(A.enemy,Math.floor(e.t*10),32,32,e.x-11,e.y-15,64,64,e.dir>0)}for(const p of world.particles){ctx.globalAlpha=Math.max(0,p.l/.55);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,6,6)}ctx.globalAlpha=1;drawPlayer();drawGoal();ctx.restore();drawHUD();drawMobileControls()}
function drawPlayer(){let im=A.idle,frame=Math.floor(player.anim);if(!player.on)im=player.vy<0?A.jump:A.fall;else if(Math.abs(player.vx)>25)im=A.run;if(player.inv>0&&Math.floor(performance.now()/70)%2===0)ctx.globalAlpha=.35;drawSpriteSheet(im,frame,32,32,player.x-11,player.y-14,64,64,player.face<0);ctx.globalAlpha=1}
function drawGoal(){const gx=world.goal;ctx.save();ctx.translate(gx,292);ctx.fillStyle='#f5f5f5';ctx.fillRect(22,0,8,228);ctx.fillStyle='#ffd84a';ctx.fillRect(4,5,18,18);ctx.fillStyle='#ff4f70';ctx.beginPath();ctx.moveTo(30,28);ctx.lineTo(30,86);ctx.lineTo(92,57);ctx.closePath();ctx.fill();ctx.restore()}
function drawHUD(){ctx.fillStyle='#0a203dbb';ctx.fillRect(14,14,Math.min(W-28,510),58);ctx.fillStyle='#fff';ctx.font='900 18px Arial';ctx.textAlign='left';ctx.fillText(`УРОВЕНЬ ${levelIndex+1}/3   ♥ ${lives}   🟡 ${coins}   ★ ${score}`,30,50);ctx.font='700 13px Arial';ctx.fillStyle='#dff6ff';ctx.fillText(world.title,30,68)}
const touch={left:false,right:false,jump:false};function drawMobileControls(){if(!('ontouchstart'in window)&&innerWidth>900)return;const r=Math.min(48,W*.095),y=H-r-24;drawPad(24+r,y,r,'◀',touch.left);drawPad(38+r*3,y,r,'▶',touch.right);drawPad(W-28-r,y,r*1.05,'▲',touch.jump)}function drawPad(x,y,r,label,on){ctx.globalAlpha=on?.78:.42;ctx.fillStyle=on?'#ffe44f':'#0b2948';ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle=on?'#1a3150':'#fff';ctx.font=`900 ${r*.75}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,x,y+2);ctx.globalAlpha=1;ctx.textBaseline='alphabetic'}
function touchAt(x,y,down){const r=Math.min(48,W*.095),cy=H-r-24,spots=[['left',24+r,cy,r],['right',38+r*3,cy,r],['jump',W-28-r,cy,r*1.05]];for(const [k,cx,yy,rr] of spots)if(Math.hypot(x-cx,y-yy)<rr*1.25){touch[k]=down;if(k==='jump'&&down&&!keys.jump)keys.jumpPressed=true}syncTouch()}function syncTouch(){keys.left=touch.left||keyHeld.left;keys.right=touch.right||keyHeld.right;keys.jump=touch.jump||keyHeld.jump}
const keyHeld={left:false,right:false,jump:false};addEventListener('keydown',e=>{let used=true;if(['ArrowLeft','a','A'].includes(e.key))keyHeld.left=true;else if(['ArrowRight','d','D'].includes(e.key))keyHeld.right=true;else if(['ArrowUp','w','W',' '].includes(e.key)){if(!keyHeld.jump)keys.jumpPressed=true;keyHeld.jump=true}else used=false;if(used)e.preventDefault();syncTouch()},{passive:false});addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))keyHeld.left=false;if(['ArrowRight','d','D'].includes(e.key))keyHeld.right=false;if(['ArrowUp','w','W',' '].includes(e.key))keyHeld.jump=false;syncTouch()});
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture?.(e.pointerId);touchAt(e.clientX,e.clientY,true);e.preventDefault()},{passive:false});cv.addEventListener('pointerup',e=>{touch.left=touch.right=touch.jump=false;syncTouch();e.preventDefault()},{passive:false});cv.addEventListener('pointercancel',()=>{touch.left=touch.right=touch.jump=false;syncTouch()});cv.addEventListener('pointermove',e=>{if(e.buttons){touch.left=touch.right=touch.jump=false;touchAt(e.clientX,e.clientY,true);e.preventDefault()}},{passive:false});
function loading(){ctx.fillStyle='#102b4b';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='900 22px Arial';ctx.textAlign='center';ctx.fillText(`Загрузка спрайтов ${assetsReady}/${Object.keys(A).length}`,W/2,H/2)}
function loop(now){if(!last)last=now;let dt=Math.min(.05,(now-last)/1000);last=now;if(assetsReady<Object.keys(A).length){loading();requestAnimationFrame(loop);return}acc+=dt;while(acc>=STEP){update(STEP);acc-=STEP}if(state==='play')drawWorld();else{ctx.fillStyle='#132b4a';ctx.fillRect(0,0,W,H)}requestAnimationFrame(loop)}requestAnimationFrame(loop);
document.getElementById('startBtn').onclick=startGame;document.getElementById('restartBtn').onclick=startGame;
</script>
