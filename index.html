addEventListener('keydown',e=>{let ok=true;if(['ArrowLeft','a','A'].includes(e.key))held.left=true;else if(['ArrowRight','d','D'].includes(e.key))held.right=true;else if(['ArrowUp','w','W',' '].includes(e.key))held.jump=true;else ok=false;if(ok){e.preventDefault();sync()}},{passive:false});addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))held.left=false;if(['ArrowRight','d','D'].includes(e.key))held.right=false;if(['ArrowUp','w','W',' '].includes(e.key))held.jump=false;sync()});cv.addEventListener('pointerdown',e=>{cv.setPointerCapture?.(e.pointerId);ptr.set(e.pointerId,at(e.clientX,e.clientY));sync();e.preventDefault()},{passive:false});cv.addEventListener('pointermove',e=>{if(ptr.has(e.pointerId)){ptr.set(e.pointerId,at(e.clientX,e.clientY));sync();e.preventDefault()}},{passive:false});function rel(e){ptr.delete(e.pointerId);sync();e.preventDefault()}cv.addEventListener('pointerup',rel,{passive:false});cv.addEventListener('pointercancel',rel,{passive:false});
function loading(){ctx.fillStyle='#102b4b';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='900 22px Arial';ctx.textAlign='center';ctx.fillText(`Загрузка спрайтов ${ready}/${Object.keys(A).length}`,W/2,H/2)}function loop(now){if(!last)last=now;const dt=Math.min(.05,(now-last)/1000);last=now;if(ready<Object.keys(A).length){loading();requestAnimationFrame(loop);return}acc+=dt;while(acc>=STEP){update(STEP);acc-=STEP}if(state==='play')draw();else{ctx.fillStyle='#132b4a';ctx.fillRect(0,0,W,H)}requestAnimationFrame(loop)}requestAnimationFrame(loop);startBtn.onclick=startGame;restartBtn.onclick=startGame;
