const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function snd(t){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);let f=t==='jump'?460:t==='coin'?980:t==='shoot'?590:t==='power'?760:t==='stomp'?180:t==='unlock'?1150:t==='win'?700:110;o.type=t==='shoot'||t==='coin'?'square':'triangle';o.frequency.setValueAtTime(f,audio.currentTime);if(t==='unlock'||t==='power')o.frequency.exponentialRampToValueAtTime(f*1.7,audio.currentTime+.14);g.gain.setValueAtTime(.07,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.2);o.start();o.stop(audio.currentTime+.21)}catch(e){}}
(async()=>{try{if(window.YaGames){ya=await YaGames.init();ya.features?.LoadingAPI?.ready()}}catch(e){}})();
function mkLevel(title,sub,bg,theme,len,diff,boss=false){const ground=[],plat=[],move=[],fall=[],coinsA=[],en=[],pick=[],sp=[],weap=[];let x=0,seg=0;while(x<len-650){const gap=105+((seg*41+diff*29)%130),gw=520+((seg*83)%250);ground.push([x,520,gw,180]);for(let j=0;j<2+(seg%3);j++){let px=x+130+j*185+(seg%2)*35,py=405-((seg+j*2+diff)%4)*56;plat.push([px,py,145+((seg+j)%2)*45]);coinsA.push([px+30,py-56],[px+92,py-56])}if(seg>2&&seg%4===1)move.push([x+gw-180,330-(seg%3)*45,150,seg%2?'x':'y',110+diff*9,120+diff*12]);if(diff>2&&seg%5===3)fall.push([x+gw-300,280,150]);for(let j=0;j<1+Math.min(3,diff);j++){let ex=x+170+j*150;if(ex<x+gw-70){const types=diff<2?['mush','mush','pig']:diff<4?['mush','pig','bat','mush']:['pig','bat','ghost','mush'];en.push([ex,j%3===2?300:470,types[(seg+j)%types.length],82+diff*15+j*6])}}if(diff>1&&seg%3===0)sp.push([x+gw-105,488,2+(diff>4?1:0)]);if(seg%4===2)pick.push([x+gw-140,445,['banana','kiwi','cherry','melon'][(seg+diff)%4]]);if(seg===4&&diff===1)weap.push([x+gw-160,360,'rapid']);if(seg===6&&diff===2)weap.push([x+gw-160,360,'spread']);if(seg===7&&diff>=3)weap.push([x+gw-160,360,'rocket']);x+=gw+gap;seg++}ground.push([Math.max(x,len-800),520,950,180]);if(boss)en.push([len-560,405,'boss',0]);return{title,sub,bg,theme,len,goal:len-130,start:[100,430],ground,plat,move,fall,coins:coinsA,en,pick,sp,weap,boss}}
const LEVELS=[
mkLevel('1-1 СОЛНЕЧНЫЕ ХОЛМЫ','Грибы научились разворачиваться у края','blue','hills',7600,1),mkLevel('1-2 ЛЕСНОЙ ПЕРЕВАЛ','Свиньи-гонщики · движущиеся платформы','green','hills',8200,2,true),
mkLevel('2-1 КРИСТАЛЬНОЕ ПОДЗЕМЕЛЬЕ','Летучие мыши · узкие мосты','gray','cave',8800,2),mkLevel('2-2 ГЛУБОКИЕ ШАХТЫ','Падающие платформы · шипы','brown','cave',9400,3,true),
mkLevel('3-1 ОБЛАЧНОЕ КОРОЛЕВСТВО','Вертикальные платформы · стаи мышей','pinkbg','sky',9800,3),mkLevel('3-2 НЕБЕСНАЯ КРЕПОСТЬ','Призраки преследуют игрока','blue','sky',10200,4,true),
mkLevel('4-1 ЛАВОВЫЕ РУИНЫ','Быстрые враги · сложные платформы','yellow','lava',10800,4),mkLevel('4-2 ОГНЕННЫЙ ЗАВОД','Больше ловушек и падающих мостов','brown','lava',11400,5,true),
mkLevel('5-1 ТЁМНЫЙ ЗАМОК','Все типы врагов вместе','purple','castle',12000,5),mkLevel('5-2 ТРОН ТЕНИ','Финальный марафон · большой босс','gray','castle',12800,6,true)];
function makeWorld(i){const q=LEVELS[i];w={...q,sol:q.ground.map(a=>({x:a[0],y:a[1],w:a[2],h:a[3]})),plat:q.plat.map(a=>({x:a[0],y:a[1],w:a[2],h:34,type:'static'})),moving:q.move.map(a=>({x:a[0],y:a[1],baseX:a[0],baseY:a[1],w:a[2],h:30,axis:a[3],range:a[4],speed:a[5],phase:Math.random()*6,dx:0,dy:0,type:'moving'})),falling:q.fall.map(a=>({x:a[0],y:a[1],baseY:a[1],w:a[2],h:30,trigger:0,vy:0,type:'falling'})),coins:q.coins.map(a=>({x:a[0],y:a[1],w:30,h:30,t:0,dead:false})),en:q.en.map(a=>({x:a[0],y:a[1],spawnX:a[0],spawnY:a[1],w:a[2]==='boss'?92:44,h:a[2]==='boss'?92:44,type:a[2],vx:a[2]==='boss'?0:-a[3],vy:0,dir:-1,on:false,t:0,dead:false,hp:a[2]==='boss'?16+i*2:a[2]==='pig'?2:1,baseY:a[1],cool:1})),pick:q.pick.map(a=>({x:a[0],y:a[1],type:a[2],w:38,h:38,t:0,dead:false})),weaponDrops:q.weap.map(a=>({x:a[0],y:a[1],type:a[2],w:44,h:44,t:0,dead:false})),spikes:q.sp.map(a=>({x:a[0],y:a[1],n:a[2]})),shots:[],enemyShots:[],fx:[]};p={x:q.start[0],y:q.start[1],w:42,h:48,vx:0,vy:0,on:false,ride:null,face:1,coyote:0,buf:0,anim:0,inv:0,doubleReady:true,boost:{speed:0,jump:0,shield:0,double:0},fire:0};cam=0;checkpoint={x:q.start[0],y:q.start[1]};state='play';toast=q.title;toastT=2}
function plats(){return w.sol.concat(w.plat,w.moving,w.falling.filter(a=>a.y<760))}function burst(x,y,c,n=10){for(let i=0;i<n;i++)w.fx.push({x,y,vx:(Math.random()-.5)*300,vy:-60-Math.random()*320,l:.55,c})}
function startGame(from=0){li=from;lives=3+meta.up.heart;score=coins=kills=combo=bestCombo=0;makeWorld(li);for(const id of['menu','shop','skins','end'])E(id).classList.add('hidden');try{ya?.features?.GameplayAPI?.start()}catch(e){}}
function finish(win){state=win?'win':'lose';E('end').classList.remove('hidden');E('endTitle').textContent=win?'КАМПАНИЯ ПРОЙДЕНА!':'ИГРА ОКОНЧЕНА';const reward=Math.floor(score/700)+coins+Math.floor(kills/4);meta.bank+=reward;meta.best=Math.max(meta.best,score);if(win)meta.progress=10;save();E('endText').textContent='Награда: '+reward+' кристаллов';E('endStats').innerHTML='<span class="stat">ОЧКИ '+score+'</span><span class="stat">МОНЕТЫ '+coins+'</span><span class="stat">ВРАГИ '+kills+'</span><span class="stat">КОМБО '+bestCombo+'</span>';try{ya?.features?.GameplayAPI?.stop()}catch(e){}snd(win?'win':'hurt')}
function nextLevel(){score+=1500;meta.progress=Math.max(meta.progress,li+1);save();if(li>=LEVELS.length-1)finish(true);else{li++;makeWorld(li)}}
function respawn(){lives--;snd('hurt');if(lives<=0){finish(false);return}p.x=checkpoint.x;p.y=checkpoint.y;p.vx=p.vy=0;p.inv=1.5}
function edgeAhead(e){const px=e.dir>0?e.x+e.w+8:e.x-8,py=e.y+e.h+8;return plats().some(s=>px>=s.x&&px<=s.x+s.w&&py>=s.y&&py<=s.y+s.h+12)}
function movePlayer(dt){if(p.ride){p.x+=p.ride.dx;p.y+=p.ride.dy}p.ride=null;p.x+=p.vx*dt;for(const s of plats())if(hit(p,s)){if(p.vx>0)p.x=s.x-p.w;else if(p.vx<0)p.x=s.x+s.w;p.vx=0}p.y+=p.vy*dt;p.on=false;for(const s of plats())if(hit(p,s)){if(p.vy>=0&&p.y+p.h-s.y<28){p.y=s.y-p.h;p.vy=0;p.on=true;p.doubleReady=true;if(s.type==='moving')p.ride=s;if(s.type==='falling'&&!s.trigger)s.trigger=.45}else if(p.vy<0){p.y=s.y+s.h;p.vy=0}}}
function cycleWeapon(dir=1){const list=Object.keys(WEAP).filter(k=>meta.weapons[k]);let i=list.indexOf(meta.equipped);meta.equipped=list[(i+dir+list.length)%list.length];save();toast='ОРУЖИЕ: '+WEAP[meta.equipped].name;toastT=1.2}
function shoot(){if(p.fire>0)return;const d=WEAP[meta.equipped];p.fire=d.rate;snd('shoot');const add=(ang,damage=d.dmg,size=10)=>w.shots.push({x:p.x+p.w/2+p.face*18,y:p.y+22,vx:Math.cos(ang)*d.speed*p.face,vy:Math.sin(ang)*d.speed,life:1.5,dmg:damage,size,type:meta.equipped});if(meta.equipped==='spread'){add(-.18);add(0);add(.18)}else add(0,d.dmg,meta.equipped==='rocket'?16:10)}
function unlockWeapon(q){q.dead=true;if(!meta.weapons[q.type]){meta.weapons[q.type]=true;meta.equipped=q.type;save();toast='НОВОЕ ПОСТОЯННОЕ ОРУЖИЕ: '+WEAP[q.type].name;snd('unlock')}else{score+=500;toast='ДУБЛИКАТ ОРУЖИЯ +500';snd('coin')}toastT=2.2}
function power(q){q.dead=true;const t=q.type;if(t==='banana')p.boost.speed=14;if(t==='kiwi')p.boost.shield=18;if(t==='cherry'){p.boost.double=18;p.doubleReady=true}if(t==='melon')p.boost.jump=16;score+=220;toast=t==='banana'?'ТУРБО':t==='kiwi'?'ЩИТ':t==='cherry'?'ДВОЙНОЙ ПРЫЖОК':'СУПЕР-ПРЫЖОК';toastT=1.3;snd('power')}
function hurt(){if(p.inv>0)return;if(p.boost.shield>0){p.boost.shield=0;p.inv=.8;toast='ЩИТ СПАС';toastT=1;return}lives--;p.inv=1.2;p.vy=-450;p.vx=-p.face*240;snd('hurt');if(lives<=0)finish(false)}
function killEnemy(e,bonus=250){if(e.dead)return;e.dead=true;kills++;combo++;bestCombo=Math.max(bestCombo,combo);score+=bonus+combo*20;burst(e.x+e.w/2,e.y+e.h/2,'#ffe36b',12);snd('stomp')}
function updatePlatforms(dt){for(const m of w.moving){const ox=m.x,oy=m.y;m.phase+=dt*m.speed/100;const s=Math.sin(m.phase)*m.range;if(m.axis==='x')m.x=m.baseX+s;else m.y=m.baseY+s;m.dx=m.x-ox;m.dy=m.y-oy}for(const f of w.falling){if(f.trigger>0){f.trigger-=dt;if(f.trigger<=0)f.vy=70}if(f.vy){f.vy+=GRAV*.55*dt;f.y+=f.vy*dt}}}
function updateEnemy(e,dt){if(e.dead)return;e.t+=dt;if(e.type==='bat'){e.x+=e.vx*dt;e.y=e.baseY+Math.sin(e.t*3)*55;if(Math.abs(e.x-e.spawnX)>230){e.vx*=-1;e.dir=Math.sign(e.vx)}}else if(e.type==='ghost'){let dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*(75+li*5)*dt;e.y+=dy/d*(65+li*4)*dt}else if(e.type==='boss'){let dx=p.x-e.x;e.dir=Math.sign(dx)||e.dir;e.vx=e.dir*(85+li*4);e.vy=Math.min(900,e.vy+GRAV*dt);e.x+=e.vx*dt;e.y+=e.vy*dt;e.on=false;for(const s of plats())if(hit(e,s)&&e.vy>=0){e.y=s.y-e.h;e.vy=0;e.on=true}e.cool-=dt;if(e.on&&Math.random()<.012)e.vy=-640;if(e.cool<=0){e.cool=1.2;w.enemyShots.push({x:e.x+e.w/2,y:e.y+30,vx:e.dir*340,vy:-70,life:3});snd('boss')}}else{e.vy=Math.min(900,e.vy+GRAV*dt);if((e.type==='mush'||e.type==='pig')&&!edgeAhead(e)){e.vx*=-1;e.dir=Math.sign(e.vx)}if(e.type==='pig'&&Math.abs(p.x-e.x)<360)e.vx=Math.sign(p.x-e.x)*(150+li*6);e.x+=e.vx*dt;let side=false;for(const s of plats())if(hit(e,s)){side=true;if(e.vx>0)e.x=s.x-e.w;else e.x=s.x+s.w}if(side){e.vx*=-1;e.dir=Math.sign(e.vx)}e.y+=e.vy*dt;e.on=false;for(const s of plats())if(hit(e,s)&&e.vy>=0){e.y=s.y-e.h;e.vy=0;e.on=true}if(e.y>760){e.x=e.spawnX;e.y=e.spawnY;e.vy=0;e.vx=-Math.max(85,Math.abs(e.vx));e.dir=-1}}
if(hit(p,e)){if(p.vy>180&&p.y+p.h<e.y+e.h*.7){e.hp--;p.vy=-620;if(e.hp<=0)killEnemy(e,e.type==='boss'?1800:260)}else hurt()}}

function sheet(im,fw,fh,x,y,wid,hei,t=0,flip=false){if(!im||!im.complete||!im.naturalWidth)return;const n=Math.max(1,Math.floor(im.naturalWidth/fw)),f=Math.floor(t)%n;ctx.save();if(flip){ctx.translate(x+wid,y);ctx.scale(-1,1);ctx.drawImage(im,f*fw,0,fw,fh,0,0,wid,hei)}else ctx.drawImage(im,f*fw,0,fw,fh,x,y,wid,hei);ctx.restore()}
