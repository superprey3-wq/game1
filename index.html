for(const z of w.sp){const r={x:z.x,y:z.y,w:z.n*32,h:30};if(hit(p,r))hurt()}for(const f of w.fx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=850*dt;f.l-=dt}w.fx=w.fx.filter(f=>f.l>0);if(p.y>900){loseLife();return}if(p.x>w.goal)nextLevel();cam+=(clamp(p.x-W*.35,0,Math.max(0,w.len-W))-cam)*Math.min(1,dt*6)}
function sheet(im,frame,fw,fh,x,y,dw,dh,flip=false){if(!im?.complete||!im.naturalWidth)return;let cols=Math.max(1,Math.floor(im.naturalWidth/fw)),rows=Math.max(1,Math.floor(im.naturalHeight/fh)),f=((frame%(cols*rows))+(cols*rows))%(cols*rows),sx=f%cols*fw,sy=Math.floor(f/cols)*fh;ctx.save();ctx.translate(x+(flip?dw:0),y);ctx.scale(flip?-1:1,1);ctx.drawImage(im,sx,sy,fw,fh,0,0,dw,dh);ctx.restore()}

function bg(){const q=w||LEVELS[0],im=A[q.bg];let top=q.theme==='cave'?'#111729':q.theme==='sky'?'#a46cf2':q.theme==='lava'?'#ff7040':q.theme==='castle'?'#160c2e':'#73c9ff';ctx.fillStyle=top;ctx.fillRect(0,0,W,H);if(im?.complete&&im.naturalWidth){let s=5,iw=im.naturalWidth*s,ih=im.naturalHeight*s;ctx.globalAlpha=.35;for(let x=-(cam*.12)%iw-iw;x<W+iw;x+=iw)for(let y=0;y<H;y+=ih)ctx.drawImage(im,x,y,iw,ih);ctx.globalAlpha=1}

function draw(){bg();ctx.save();ctx.translate(-cam,0);for(const s of w.sol){for(let y=s.y;y<s.y+s.h;y+=TILE)for(let x=s.x;x<s.x+s.w;x+=TILE)tile(x,y,0)}for(const z of w.sp)for(let i=0;i<z.n;i++)if(A.spike?.complete)ctx.drawImage(A.spike,z.x+i*32,z.y,32,32);for(const c of w.coins)if(!c.dead){ctx.save();ctx.translate(c.x+15,c.y+15);ctx.scale(.55+.45*Math.abs(Math.sin(c.t)),1);sheet(A.orange,Math.floor(c.t),32,32,-18,-18,36,36);ctx.restore()}for(const q of w.pick)if(!q.dead)sheet(A[q.type],Math.floor(q.t),32,32,q.x-2,q.y-2,42,42);for(const e of w.en)if(!e.dead){if(e.type==='bat')sheet(A.bat,Math.floor(e.t*10),46,30,e.x-5,e.y-7,64,48,e.dir>0);else{let sz=e.type==='boss'?92:64;sheet(A.mush,Math.floor(e.t*10),32,32,e.x-(sz-e.w)/2,e.y-(sz-e.h),sz,sz,e.dir>0);if(e.type==='boss'){ctx.fillStyle='#1a0b24';ctx.fillRect(e.x-8,e.y-14,92,8);ctx.fillStyle='#ff5178';ctx.fillRect(e.x-8,e.y-14,92*(e.hp/8),8)}}}for(const s of w.shots){ctx.fillStyle='#e9fbff';ctx.fillRect(s.x-10,s.y-4,20,8);ctx.fillStyle='#65ddff';ctx.fillRect(s.x-6,s.y-2,12,4)}for(const f of w.fx){ctx.globalAlpha=Math.max(0,f.l/.55);ctx.fillStyle=f.c;ctx.fillRect(f.x,f.y,6,6)}ctx.globalAlpha=1;drawPlayer();ctx.fillStyle='#f6f6f6';ctx.fillRect(w.goal+18,300,8,220);ctx.fillStyle='#ff5478';ctx.beginPath();ctx.moveTo(w.goal+26,315);ctx.lineTo(w.goal+26,372);ctx.lineTo(w.goal+88,343);ctx.closePath();ctx.fill();ctx.restore();hud();mobile()}
function drawPlayer(){let sk=meta.skin||'frog',im=A[sk+'Idle'];if(!p.on)im=p.vy<0?A[sk+'Jump']:A[sk+'Fall'];else if(Math.abs(p.vx)>25)im=A[sk+'Run'];if(p.inv>0&&Math.floor(performance.now()/70)%2===0)ctx.globalAlpha=.35;sheet(im,Math.floor(p.anim),32,32,p.x-11,p.y-14,64,64,p.face<0);ctx.globalAlpha=1;if(p.boost.shield>0){ctx.strokeStyle='#87f7ff';ctx.lineWidth=3;ctx.strokeRect(p.x-6,p.y-8,54,62)}}
function hud(){ctx.fillStyle='#07182fd9';ctx.fillRect(14,14,Math.min(W-28,720),78);ctx.fillStyle='#fff';ctx.font='900 17px Arial';ctx.textAlign='left';ctx.fillText(`МИР ${li+1}/5   ♥ ${lives}   🟡 ${coins}   ★ ${score}   ⚔ ${kills}`,28,42);ctx.font='800 13px Arial';ctx.fillStyle='#bfeeff';ctx.fillText(w.title+' · '+w.sub,28,66);let bs=[];for(const [k,v] of Object.entries(p.boost))if(v>0)bs.push(k.toUpperCase()+' '+Math.ceil(v));if(bs.length){ctx.fillStyle='#ffe773';ctx.fillText(bs.join('  '),28,86)}if(toastT>0){ctx.globalAlpha=Math.min(1,toastT);ctx.fillStyle='#07182fe6';ctx.fillRect(W/2-190,112,380,48);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='900 16px Arial';ctx.fillText(toast,W/2,142);ctx.globalAlpha=1}}
function mobile(){if(!('ontouchstart'in window)&&W>900)return;const r=Math.min(48,W*.095),y=H-r-22;pad(24+r,y,r,'◀',touch.left);pad(38+r*3,y,r,'▶',touch.right);pad(W-28-r,y,r*1.05,'▲',touch.jump)}function pad(x,y,r,t,on){ctx.globalAlpha=on?.8:.43;ctx.fillStyle=on?'#ffe44f':'#0b2948';ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle=on?'#1a3150':'#fff';ctx.font=`900 ${r*.75}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,x,y+2);ctx.globalAlpha=1;ctx.textBaseline='alphabetic'}
const kh={left:false,right:false,jump:false};function sync(){keys.left=kh.left||touch.left;keys.right=kh.right||touch.right;keys.jump=kh.jump||touch.jump}addEventListener('keydown',e=>{let u=1;if(['ArrowLeft','a','A'].includes(e.key))kh.left=true;else if(['ArrowRight','d','D'].includes(e.key))kh.right=true;else if(['ArrowUp','w','W',' '].includes(e.key)){if(!kh.jump)keys.pressed=true;kh.jump=true}else u=0;if(u)e.preventDefault();sync()},{passive:false});addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))kh.left=false;if(['ArrowRight','d','D'].includes(e.key))kh.right=false;if(['ArrowUp','w','W',' '].includes(e.key))kh.jump=false;sync()});function touchAt(x,y,d){const r=Math.min(48,W*.095),cy=H-r-22,sp=[['left',24+r,cy,r],['right',38+r*3,cy,r],['jump',W-28-r,cy,r*1.05]];for(const [k,cx,yy,rr] of sp)if(Math.hypot(x-cx,y-yy)<rr*1.25){if(k==='jump'&&d&&!keys.jump)keys.pressed=true;touch[k]=d}sync()}cv.addEventListener('pointerdown',e=>{touchAt(e.clientX,e.clientY,true);e.preventDefault()},{passive:false});cv.addEventListener('pointerup',e=>{touch.left=touch.right=touch.jump=false;sync();e.preventDefault()},{passive:false});cv.addEventListener('pointercancel',()=>{touch.left=touch.right=touch.jump=false;sync()});
function loading(){ctx.fillStyle='#102b4b';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='900 22px Arial';ctx.textAlign='center';ctx.fillText(`Загрузка мира ${ready}/${Object.keys(A).length}`,W/2,H/2)}function loop(t){if(!last)last=t;let dt=Math.min(.05,(t-last)/1000);last=t;if(ready<Object.keys(A).length){loading();requestAnimationFrame(loop);return}acc+=dt;while(acc>=STEP){update(STEP);acc-=STEP}if(state==='play')draw();else{ctx.fillStyle='#0b1930';ctx.fillRect(0,0,W,H)}requestAnimationFrame(loop)}requestAnimationFrame(loop);
const upgrades=[['jump','Высота прыжка','Прыжок выше на каждом уровне',8],['speed','Скорость','Больше максимальная скорость',8],['heart','Доп. жизнь','+1 жизнь в начале забега',14],['blaster','Бластер','Дольше работает оружие',10]];function renderShop(){E('shopGrid').innerHTML=upgrades.map(([id,n,d,c])=>{let lv=meta.up[id],cost=c*(lv+1);return `<div class="shopItem"><b>${n} · ур.${lv}</b><span class="tag">${d}</span><div><button class="btn alt" style="font-size:14px;padding:9px 12px" onclick="buyUp('${id}',${cost})">КУПИТЬ ${cost}</button></div></div>`}).join('')}window.buyUp=(id,c)=>{if(meta.bank<c){toast='НЕ ХВАТАЕТ КРИСТАЛЛОВ';return}meta.bank-=c;meta.up[id]++;save();renderShop()};
const skinCost={frog:0,mask:18,pink:22,virtual:28},skinName={frog:'НИНДЗЯ-ЛЯГУШКА',mask:'МАСКА',pink:'РОЗОВЫЙ ГЕРОЙ',virtual:'ВИРТУАЛ'};function renderSkins(){E('skinGrid').innerHTML=Object.keys(skinCost).map(id=>{let open=meta.unlocked[id],sel=meta.skin===id;return `<div class="shopItem"><b>${skinName[id]}</b><span class="tag">${sel?'ВЫБРАН':open?'ОТКРЫТ':'ЦЕНА '+skinCost[id]}</span><div><button class="btn ${sel?'dark':'alt'}" style="font-size:14px;padding:9px 12px" onclick="skinAction('${id}')">${sel?'АКТИВЕН':open?'ВЫБРАТЬ':'КУПИТЬ'}</button></div></div>`}).join('')}window.skinAction=id=>{if(meta.unlocked[id])meta.skin=id;else{let c=skinCost[id];if(meta.bank<c)return;meta.bank-=c;meta.unlocked[id]=true;meta.skin=id}save();renderSkins()};
