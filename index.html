const B='https://raw.githubusercontent.com/marpor/PixelAdventure/main/PixelAdventure/';const skinDefs={frog:'Ninja%20Frog',mask:'Mask%20Dude',pink:'Pink%20Man',virtual:'Virtual%20Guy'};
const urls={terrain:B+'Terrain/Terrain%20(16x16).png',mush:B+'Enemies/Mushroom/Run%20(32x32).png',bat:B+'Enemies/Bat/Flying%20(46x30).png',spike:B+'Traps/Spikes/Idle.png',apple:B+'Items/Fruits/Apple.png',banana:B+'Items/Fruits/Bananas.png',cherry:B+'Items/Fruits/Cherries.png',kiwi:B+'Items/Fruits/Kiwi.png',melon:B+'Items/Fruits/Melon.png',orange:B+'Items/Fruits/Orange.png',blue:B+'Background/Blue.png',green:B+'Background/Green.png',brown:B+'Background/Brown.png',gray:B+'Background/Gray.png',pinkbg:B+'Background/Pink.png',purple:B+'Background/Purple.png',yellow:B+'Background/Yellow.png'};for(const[id,dir]of Object.entries(skinDefs)){for(const a of['Idle','Run','Jump','Fall'])urls[id+a]=B+'Main%20Characters/'+dir+'/'+a+'%20(32x32).png'}

function snd(t){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);let f=t==='jump'?460:t==='coin'?980:t==='shoot'?570:t==='power'?760:t==='stomp'?180:t==='win'?690:t==='boss'?90:110;o.type=t==='coin'||t==='shoot'?'square':'triangle';o.frequency.setValueAtTime(f,audio.currentTime);if(t==='coin'||t==='power'||t==='win')o.frequency.exponentialRampToValueAtTime(f*1.55,audio.currentTime+.12);g.gain.setValueAtTime(.075,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.21);o.start();o.stop(audio.currentTime+.22)}catch(e){}}

function mkLevel(n,title,sub,bg,theme,len,diff,boss=false){const ground=[],plat=[],coinsA=[],en=[],pick=[],sp=[];let x=0,seg=0;while(x<len-500){const gap=seg<2?120+diff*5:120+((seg*37+diff*53)%110);const gw=520+((seg*71)%260);ground.push([x,520,gw,180]);for(let j=0;j<2+(seg%3);j++){let px=x+160+j*180+(seg%2)*35,py=400-((seg+j*2+diff)%4)*55;plat.push([px,py,145+((j+seg)%2)*45]);coinsA.push([px+35,py-58],[px+95,py-58])}if(seg%2===1)pick.push([x+gw-120,450,['banana','apple','kiwi','cherry','melon'][(seg+diff)%5]]);for(let j=0;j<1+Math.min(3,diff);j++){let ex=x+180+j*150;if(ex<x+gw-80)en.push([ex,470,j%3===0&&diff>1?'charge':'walk',80+diff*14+j*5])}if(diff>1&&seg%2===0)en.push([x+gw-180,260-((seg%3)*45),'bat',100+diff*16]);if(diff>2&&seg%3===2)sp.push([x+gw-110,488,2+(diff>4?1:0)]);x+=gw+gap;seg++}ground.push([Math.max(x,len-700),520,850,180]);let goal=len-120;if(boss){en.push([goal-420,420,'boss',0])}return{title,sub,bg,theme,len,goal,start:[100,430],ground,plat,coins:coinsA,en,pick,sp,boss}}
const LEVELS=[

function platforms(){return w.sol.concat(w.platObj)}

function startGame(from=0){li=from;lives=3+meta.up.heart;score=0;coins=0;kills=0;combo=0;bestCombo=0;makeWorld(li);for(const id of['menu','shop','skins','end'])E(id).classList.add('hidden');try{ya?.features?.GameplayAPI?.start()}catch(e){}}
function finish(win){state=win?'win':'lose';E('end').classList.remove('hidden');E('endTitle').textContent=win?'КАМПАНИЯ ПРОЙДЕНА!':'ИГРА ОКОНЧЕНА';let reward=Math.floor(score/700)+coins+Math.floor(kills/4);meta.bank+=reward;meta.best=Math.max(meta.best,score);if(win)meta.progress=10;save();E('endText').textContent=win?'Ты прошёл все 10 уровней.':'Попробуй усиления, скины и новый забег.';E('endStats').innerHTML=`<span class="stat">ОЧКИ ${score}</span><span class="stat">МОНЕТЫ ${coins}</span><span class="stat">ВРАГИ ${kills}</span><span class="stat">КОМБО ${bestCombo}</span><span class="stat">+${reward} КРИСТАЛЛОВ</span>`;try{ya?.features?.GameplayAPI?.stop()}catch(e){};snd(win?'win':'boss')}
function respawn(){lives--;snd('boss');if(lives<=0)return finish(false);p.x=checkpoint.x;p.y=checkpoint.y;p.vx=p.vy=0;p.inv=1.5}
function nextLevel(){score+=1500+li*300;meta.progress=Math.max(meta.progress,li+1);save();if(li>=LEVELS.length-1)finish(true);else{li++;makeWorld(li)}}
function movePlayer(dt){p.x+=p.vx*dt;for(const s of platforms())if(hit(p,s)){if(p.vx>0)p.x=s.x-p.w;else if(p.vx<0)p.x=s.x+s.w;p.vx=0}p.y+=p.vy*dt;p.on=false;for(const s of platforms())if(hit(p,s)){if(p.vy>0){p.y=s.y-p.h;p.vy=0;p.on=true;p.doubleReady=true}else if(p.vy<0){p.y=s.y+s.h;p.vy=0}}}
function power(q){q.dead=true;snd('power');burst(q.x+19,q.y+19,'#fff277',16);if(q.type==='apple'){p.boost.blaster=14+meta.up.blaster*4;toast='⚡ БЛАСТЕР'}else if(q.type==='banana'){p.boost.speed=14;toast='⚡ ТУРБО'}else if(q.type==='kiwi'){p.boost.shield=18;toast='🛡 ЩИТ'}else if(q.type==='cherry'){p.boost.double=18;p.doubleReady=true;toast='🍒 ДВОЙНОЙ ПРЫЖОК'}else{p.boost.jump=18;toast='⬆ СУПЕР-ПРЫЖОК'}toastT=1.5;score+=250}
function hurt(){if(p.inv>0)return;if(p.boost.shield>0){p.boost.shield=0;p.inv=.8;toast='ЩИТ СПАС ТЕБЯ';toastT=1;return}lives--;p.inv=1.2;p.vy=-430;p.vx=-p.face*230;snd('boss');if(lives<=0)finish(false)}
function update(dt){if(state!=='play')return;toastT=Math.max(0,toastT-dt);p.inv=Math.max(0,p.inv-dt);for(const k in p.boost)p.boost[k]=Math.max(0,p.boost[k]-dt);if(keys.pressed){p.buf=.14;keys.pressed=false}else p.buf=Math.max(0,p.buf-dt);p.coyote=p.on?.12:Math.max(0,p.coyote-dt);let dir=(keys.right?1:0)-(keys.left?1:0),run=BASERUN+meta.up.speed*18+(p.boost.speed>0?90:0),jump=BASEJUMP-meta.up.jump*35-(p.boost.jump>0?150:0);if(dir){p.vx+=dir*(p.on?ACC:AIR)*dt;p.vx=clamp(p.vx,-run,run);p.face=dir}else if(p.on){let s=Math.sign(p.vx);p.vx=s*Math.max(0,Math.abs(p.vx)-FRIC*dt)}if(p.buf>0&&p.coyote>0){p.vy=jump;p.on=false;p.buf=0;snd('jump')}else if(p.buf>0&&p.boost.double>0&&p.doubleReady){p.vy=jump*.94;p.doubleReady=false;p.buf=0;snd('jump')}if(!keys.jump&&p.vy<0)p.vy+=GRAV*.7*dt;p.vy=Math.min(1100,p.vy+GRAV*dt);movePlayer(dt);p.anim+=dt*(Math.abs(p.vx)>20?12:6);if(p.boost.blaster>0){p.fire-=dt;if(p.fire<=0){p.fire=.32;w.shots.push({x:p.x+p.w/2,y:p.y+20,vx:p.face*720,w:18,h:8});snd('shoot')}}for(const q of w.pick)if(!q.dead){q.t+=dt;if(hit(p,q))power(q)}for(const c of w.coins)if(!c.dead){c.t+=dt*7;if(hit(p,{x:c.x-4,y:c.y-4,w:38,h:38})){c.dead=true;coins++;score+=100;combo++;bestCombo=Math.max(bestCombo,combo);snd('coin')}}for(const s of w.shots)s.x+=s.vx*dt;w.shots=w.shots.filter(s=>s.x>-100&&s.x<w.len+200);for(const e of w.en){if(e.dead)continue;e.t+=dt;e.cool-=dt;if(e.type==='bat'){e.x+=Math.sin(e.t*2.4)*35*dt;e.y=e.baseY+Math.sin(e.t*3.1)*32}else if(e.type==='boss'){let dx=p.x-e.x;e.dir=Math.sign(dx)||1;if(Math.abs(dx)>120)e.x+=e.dir*(75+li*7)*dt;if(e.cool<=0){e.cool=1.3;let sx=e.x+e.w/2,sy=e.y+30;w.shots.push({x:sx,y:sy,vx:e.dir*430,w:22,h:10,enemy:true});snd('boss')}}else{e.vy=Math.min(1000,e.vy+GRAV*dt);e.x+=e.vx*dt;let turn=false;for(const s of platforms())if(hit(e,s)){turn=true;if(e.vx>0)e.x=s.x-e.w;else e.x=s.x+s.w}if(turn){e.vx=-e.vx;e.dir=Math.sign(e.vx)}e.y+=e.vy*dt;e.on=false;for(const s of platforms())if(hit(e,s)&&e.vy>=0){e.y=s.y-e.h;e.vy=0;e.on=true;break}if(e.type==='charge'&&Math.abs(p.x-e.x)<350)e.vx=Math.sign(p.x-e.x)*(125+li*10)}if(hit(p,e)){if(p.vy>120&&p.y+p.h-p.vy*dt<=e.y+16){e.hp--;p.vy=-450;score+=e.type==='boss'?500:250;snd('stomp');if(e.hp<=0){e.dead=true;kills++;combo++;bestCombo=Math.max(bestCombo,combo);burst(e.x+e.w/2,e.y+e.h/2,'#ffe16a',e.type==='boss'?30:12)}}else hurt()}}for(const s of w.shots){if(s.enemy&&hit(p,s)){s.dead=true;hurt()}if(!s.enemy)for(const e of w.en)if(!e.dead&&hit(s,e)){s.dead=true;e.hp--;if(e.hp<=0){e.dead=true;kills++;score+=e.type==='boss'?1200:300;burst(e.x+e.w/2,e.y+e.h/2,'#8df0ff',16)}}}w.shots=w.shots.filter(s=>!s.dead);for(const z of w.spikes){const r={x:z.x,y:z.y,w:z.n*32,h:32};if(hit(p,r))hurt()}for(const f of w.fx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=800*dt;f.l-=dt}w.fx=w.fx.filter(f=>f.l>0);if(p.x>checkpoint.x+1700){checkpoint={x:p.x,y:Math.min(p.y,430)};toast='🚩 ЧЕКПОИНТ';toastT=1}if(p.y>900){respawn();return}let bossAlive=w.en.some(e=>e.type==='boss'&&!e.dead);if(p.x>w.goal&&!bossAlive)nextLevel();cam+=(clamp(p.x-W*.34,0,Math.max(0,w.len-W))-cam)*Math.min(1,dt*6)}
function spr(im,frame,fw,fh,x,y,ww,hh,flip=false){if(!im.complete||!im.naturalWidth)return;const cols=Math.max(1,Math.floor(im.naturalWidth/fw)),rows=Math.max(1,Math.floor(im.naturalHeight/fh)),f=frame%(cols*rows),sx=(f%cols)*fw,sy=Math.floor(f/cols)*fh;ctx.save();ctx.translate(x+(flip?ww:0),y);ctx.scale(flip?-1:1,1);ctx.drawImage(im,sx,sy,fw,fh,0,0,ww,hh);ctx.restore()}
function bg(){const im=A[w.bg];let fill=w.theme==='cave'?'#182033':w.theme==='lava'?'#6e2618':w.theme==='castle'?'#211a3d':w.theme==='sky'?'#7bcfff':'#65c6ff';ctx.fillStyle=fill;ctx.fillRect(0,0,W,H);if(im.complete&&im.naturalWidth){let sc=5,iw=im.naturalWidth*sc,ih=im.naturalHeight*sc;for(let x=-(cam*.12)%iw-iw;x<W+iw;x+=iw)for(let y=0;y<H;y+=ih)ctx.drawImage(im,x,y,iw,ih)}ctx.globalAlpha=.16;for(let i=0;i<7;i++){ctx.fillStyle=w.theme==='lava'?'#ff7a35':w.theme==='cave'?'#9bdcff':'#fff';ctx.beginPath();ctx.arc(((i*223-cam*.25)%(W+250)+W+250)%(W+250)-100,90+(i%3)*85,40+(i%4)*18,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
function tileRect(s){for(let y=s.y;y<s.y+s.h;y+=TILE)for(let x=s.x;x<s.x+s.w;x+=TILE){if(A.terrain.complete&&A.terrain.naturalWidth)ctx.drawImage(A.terrain,96,0,16,16,x,y,TILE,TILE)}}
function draw(){bg();ctx.save();ctx.translate(-cam,0);for(const s of w.sol)tileRect(s);for(const s of w.platObj)tileRect(s);for(const z of w.spikes)for(let i=0;i<z.n;i++)ctx.drawImage(A.spike,z.x+i*32,z.y,32,32);for(const c of w.coins)if(!c.dead){ctx.save();ctx.translate(c.x+15,c.y+15);ctx.scale(.72+.28*Math.abs(Math.sin(c.t)),1);spr(A.orange,Math.floor(c.t),32,32,-18,-18,36,36);ctx.restore()}for(const q of w.pick)if(!q.dead)spr(A[q.type],Math.floor(q.t*8),32,32,q.x-5,q.y-5,48,48);for(const e of w.en)if(!e.dead){if(e.type==='bat')spr(A.bat,Math.floor(e.t*10),46,30,e.x-8,e.y-5,58,42,e.dir>0);else if(e.type==='boss'){ctx.fillStyle='#0008';ctx.fillRect(e.x-4,e.y-16,e.w+8,8);ctx.fillStyle='#ff4d72';ctx.fillRect(e.x-4,e.y-16,(e.w+8)*clamp(e.hp/(10+Math.floor(li/2)*4),0,1),8);spr(A.mush,Math.floor(e.t*8),32,32,e.x-28,e.y-24,142,142,e.dir>0)}else spr(A.mush,Math.floor(e.t*10),32,32,e.x-11,e.y-15,64,64,e.dir>0)}for(const s of w.shots){ctx.fillStyle=s.enemy?'#ff5b78':'#7ff7ff';ctx.fillRect(s.x,s.y,s.w,s.h)}for(const f of w.fx){ctx.globalAlpha=Math.max(0,f.l/.55);ctx.fillStyle=f.c;ctx.fillRect(f.x,f.y,6,6)}ctx.globalAlpha=1;drawPlayer();ctx.fillStyle='#fff';ctx.fillRect(w.goal,300,8,220);ctx.fillStyle='#ff4e76';ctx.fillRect(w.goal+8,310,72,46);ctx.restore();hud();mobile()}
function drawPlayer(){const id=meta.skin||'frog';let im=A[id+'Idle'];if(!p.on)im=A[id+(p.vy<0?'Jump':'Fall')];else if(Math.abs(p.vx)>20)im=A[id+'Run'];if(p.inv>0&&Math.floor(performance.now()/80)%2===0)ctx.globalAlpha=.35;spr(im,Math.floor(p.anim),32,32,p.x-11,p.y-14,64,64,p.face<0);ctx.globalAlpha=1}
function hud(){ctx.fillStyle='#071a31d9';ctx.fillRect(12,12,Math.min(W-24,690),76);ctx.fillStyle='#fff';ctx.font='900 17px Arial';ctx.textAlign='left';ctx.fillText(`УРОВЕНЬ ${li+1}/10   ♥ ${lives}   🟡 ${coins}   ★ ${score}`,28,39);ctx.font='700 13px Arial';ctx.fillStyle='#dff6ff';ctx.fillText(w.title+' — '+w.sub,28,62);let b=[];for(const[k,v]of Object.entries(p.boost))if(v>0)b.push(k.toUpperCase()+' '+Math.ceil(v));ctx.fillStyle='#ffe16a';ctx.fillText(b.join('  '),28,81);if(toastT>0){ctx.textAlign='center';ctx.font='900 24px Arial';ctx.fillStyle='#fff';ctx.fillText(toast,W/2,120)}}
function mobile(){if(!('ontouchstart'in window)&&W>900)return;const r=Math.min(48,W*.095),y=H-r-22;pad(24+r,y,r,'◀',touch.left);pad(38+r*3,y,r,'▶',touch.right);pad(W-28-r,y,r*1.05,'▲',touch.jump)}function pad(x,y,r,t,on){ctx.globalAlpha=on?.82:.44;ctx.fillStyle=on?'#ffe44f':'#0b2948';ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle=on?'#1a3150':'#fff';ctx.font=`900 ${r*.75}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,x,y+2);ctx.globalAlpha=1;ctx.textBaseline='alphabetic'}
const held={left:false,right:false,jump:false};function sync(){keys.left=held.left||touch.left;keys.right=held.right||touch.right;keys.jump=held.jump||touch.jump}addEventListener('keydown',e=>{let u=true;if(['ArrowLeft','a','A'].includes(e.key))held.left=true;else if(['ArrowRight','d','D'].includes(e.key))held.right=true;else if(['ArrowUp','w','W',' '].includes(e.key)){if(!held.jump)keys.pressed=true;held.jump=true}else u=false;if(u)e.preventDefault();sync()},{passive:false});addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))held.left=false;if(['ArrowRight','d','D'].includes(e.key))held.right=false;if(['ArrowUp','w','W',' '].includes(e.key))held.jump=false;sync()});
function touchAt(x,y,d){const r=Math.min(48,W*.095),cy=H-r-22,spots=[['left',24+r,cy,r],['right',38+r*3,cy,r],['jump',W-28-r,cy,r*1.05]];for(const[k,cx,yy,rr]of spots)if(Math.hypot(x-cx,y-yy)<rr*1.3){touch[k]=d;if(k==='jump'&&d&&!keys.jump)keys.pressed=true}sync()}cv.addEventListener('pointerdown',e=>{cv.setPointerCapture?.(e.pointerId);touchAt(e.clientX,e.clientY,true);e.preventDefault()},{passive:false});cv.addEventListener('pointerup',e=>{touch.left=touch.right=touch.jump=false;sync();e.preventDefault()},{passive:false});cv.addEventListener('pointercancel',()=>{touch.left=touch.right=touch.jump=false;sync()});
function loop(t){if(!last)last=t;let dt=Math.min(.05,(t-last)/1000);last=t;if(ready<Object.keys(A).length){ctx.fillStyle='#10294a';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='900 22px Arial';ctx.textAlign='center';ctx.fillText('Загрузка '+ready+'/'+Object.keys(A).length,W/2,H/2);requestAnimationFrame(loop);return}acc+=dt;while(acc>=STEP){update(STEP);acc-=STEP}if(state==='play')draw();else{ctx.fillStyle='#10294a';ctx.fillRect(0,0,W,H)}requestAnimationFrame(loop)}requestAnimationFrame(loop);
const upDefs=[['jump','Высокий прыжок',180],['speed','Скорость',180],['heart','Доп. жизнь',260],['blaster','Дольше бластер',220]];function renderShop(){E('shopGrid').innerHTML='';for(const[k,n,c]of upDefs){let lv=meta.up[k],cost=c*(lv+1),d=document.createElement('div');d.className='shopItem';d.innerHTML=`<b>${n}</b><span class="tag">УРОВЕНЬ ${lv}/5</span><br><button class="btn" style="font-size:13px;padding:9px 12px" ${lv>=5?'disabled':''}>${lv>=5?'МАКС':cost+' 💎'}</button>`;d.querySelector('button').onclick=()=>{if(lv<5&&meta.bank>=cost){meta.bank-=cost;meta.up[k]++;save();renderShop()}};E('shopGrid').appendChild(d)}}
const skinsDef=[['frog','Ninja Frog',0],['mask','Mask Dude',500],['pink','Pink Man',850],['virtual','Virtual Guy',1200]];function renderSkins(){E('skinGrid').innerHTML='';for(const[id,n,c]of skinsDef){let own=!!meta.unlocked[id],d=document.createElement('div');d.className='shopItem';d.innerHTML=`<b>${n}</b><span class="tag">${meta.skin===id?'ВЫБРАН':own?'КУПЛЕН':c+' 💎'}</span><br><button class="btn dark" style="font-size:13px;padding:9px 12px">${own?'ВЫБРАТЬ':'КУПИТЬ'}</button>`;d.querySelector('button').onclick=()=>{if(own){meta.skin=id}else if(meta.bank>=c){meta.bank-=c;meta.unlocked[id]=true;meta.skin=id}save();renderSkins()};E('skinGrid').appendChild(d)}}
E('playBtn').onclick=()=>{meta.progress=0;save();startGame(0)};E('continueBtn').onclick=()=>startGame(clamp(meta.progress||0,0,9));E('shopBtn').onclick=()=>{E('menu').classList.add('hidden');E('shop').classList.remove('hidden');renderShop()};E('skinsBtn').onclick=()=>{E('menu').classList.add('hidden');E('skins').classList.remove('hidden');renderSkins()};document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{E('shop').classList.add('hidden');E('skins').classList.add('hidden');E('menu').classList.remove('hidden');refreshMeta()});E('againBtn').onclick=()=>{meta.progress=0;save();startGame(0)};E('endMenuBtn').onclick=()=>{E('end').classList.add('hidden');E('menu').classList.remove('hidden');state='menu';refreshMeta()};
</script></body></html>
