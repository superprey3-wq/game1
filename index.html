function finish(win){state=win?'win':'lose';end.classList.remove('hidden');endTitle.textContent=win?'ПОБЕДА!':'ИГРА ОКОНЧЕНА';endText.textContent=win?`Все 3 уровня пройдены! Монеты: ${coins} · Очки: ${score}`:`Монеты: ${coins} · Очки: ${score}`;try{ya?.features?.GameplayAPI?.stop?.()}catch(e){}if(!win)snd('lose')}
function nextLevel(){score+=1000;if(levelIndex>=L.length-1)finish(true);else{levelIndex++;makeWorld(levelIndex)}}
function allPlatforms(){return world.solids.concat(world.bricks.filter(b=>!b.dead))}
function burst(x,y,c,n=10){for(let i=0;i<n;i++)world.particles.push({x,y,vx:(Math.random()-.5)*280,vy:-80-Math.random()*300,l:.58,c})}

function update(dt){if(state!=='play')return;toastT=Math.max(0,toastT-dt);player.inv=Math.max(0,player.inv-dt);for(const k in player.boost)player.boost[k]=Math.max(0,player.boost[k]-dt);if(keys.jumpPressed){player.jumpBuffer=.14;keys.jumpPressed=false}else player.jumpBuffer=Math.max(0,player.jumpBuffer-dt);player.coyote=player.on?.12:Math.max(0,player.coyote-dt);const dir=(keys.right?1:0)-(keys.left?1:0),speed=player.boost.speed>0?RUN*1.32:RUN,accel=player.on?ACC:AIRACC;if(dir){player.vx+=dir*accel*dt;player.vx=clamp(player.vx,-speed,speed);player.face=dir}else if(player.on){const d=Math.sign(player.vx),nv=Math.abs(player.vx)-FRICTION*dt;player.vx=d*Math.max(0,nv)}

function drawSpriteSheet(im,frame,fw,fh,x,y,w,h,flip=false){if(!im.complete||!im.naturalWidth)return;const cols=Math.max(1,Math.floor(im.naturalWidth/fw)),rows=Math.max(1,Math.floor(im.naturalHeight/fh)),f=((frame%(cols*rows))+(cols*rows))%(cols*rows),sx=(f%cols)*fw,sy=Math.floor(f/cols)*fh;ctx.save();ctx.translate(x+(flip?w:0),y);ctx.scale(flip?-1:1,1);ctx.drawImage(im,sx,sy,fw,fh,0,0,w,h);ctx.restore()}

function drawPlayer(){let im=A.idle,frame=Math.floor(player.anim);if(!player.on)im=player.vy<0?A.jump:A.fall;else if(Math.abs(player.vx)>25)im=A.run;if(player.inv>0&&Math.floor(performance.now()/70)%2===0)ctx.globalAlpha=.35;if(player.boost.shield>0){ctx.save();ctx.strokeStyle='#87f7ff';ctx.lineWidth=4;ctx.globalAlpha=.72;ctx.beginPath();ctx.arc(player.x+21,player.y+24,34+Math.sin(performance.now()*.008)*2,0,Math.PI*2);ctx.stroke();ctx.restore()}drawSpriteSheet(im,frame,32,32,player.x-11,player.y-14,64,64,player.face<0);ctx.globalAlpha=1}
function drawGoal(){const gx=world.goal;ctx.save();ctx.translate(gx,292);ctx.fillStyle='#f5f5f5';ctx.fillRect(22,0,8,228);ctx.fillStyle='#ffd84a';ctx.fillRect(4,5,18,18);ctx.fillStyle=levelIndex===2?'#b15cff':'#ff4f70';ctx.beginPath();ctx.moveTo(30,28);ctx.lineTo(30,86);ctx.lineTo(92,57);ctx.closePath();ctx.fill();ctx.restore()}
function powerText(){const b=player.boost,arr=[];if(b.blaster>0)arr.push('⚡ Бластер '+b.blaster.toFixed(0)+'с');if(b.speed>0)arr.push('⚡ Турбо '+b.speed.toFixed(0)+'с');if(b.jump>0)arr.push('⬆ Прыжок '+b.jump.toFixed(0)+'с');if(b.double>0)arr.push('🍒 x2 '+b.double.toFixed(0)+'с');if(b.shield>0)arr.push('🛡 Щит');return arr.join('   ')}
function drawHUD(){ctx.fillStyle='#0a203dcc';ctx.fillRect(14,14,Math.min(W-28,650),70);ctx.fillStyle='#fff';ctx.font='900 18px Arial';ctx.textAlign='left';ctx.fillText(`УРОВЕНЬ ${levelIndex+1}/3   ♥ ${lives}   🟡 ${coins}   ★ ${score}`,30,42);ctx.font='700 13px Arial';ctx.fillStyle='#dff6ff';ctx.fillText(world.title+' · '+world.sub,30,62);const pt=powerText();if(pt){ctx.fillStyle='#fff177';ctx.fillText(pt,30,79)}}
function drawToast(){ctx.font='900 17px Arial';const tw=Math.min(W-30,ctx.measureText(toast).width+44);ctx.fillStyle='#10243edb';ctx.fillRect(W/2-tw/2,102,tw,44);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(W/2-tw/2,102,tw,44);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(toast,W/2,130)}
const touch={left:false,right:false,jump:false},ptr=new Map();function drawMobileControls(){if(!('ontouchstart'in window)&&innerWidth>900)return;const r=Math.min(50,W*.095),y=H-r-24;drawPad(24+r,y,r,'◀',touch.left);drawPad(38+r*3,y,r,'▶',touch.right);drawPad(W-28-r,y,r*1.07,'▲',touch.jump)}function drawPad(x,y,r,label,on){ctx.globalAlpha=on?.8:.43;ctx.fillStyle=on?'#ffe44f':'#0b2948';ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle=on?'#1a3150':'#fff';ctx.font=`900 ${r*.75}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,x,y+2);ctx.globalAlpha=1;ctx.textBaseline='alphabetic'}
function controlAt(x,y){const r=Math.min(50,W*.095),cy=H-r-24,spots=[['left',24+r,cy,r],['right',38+r*3,cy,r],['jump',W-28-r,cy,r*1.07]];for(const [k,cx,yy,rr] of spots)if(Math.hypot(x-cx,y-yy)<rr*1.28)return k;return null}function syncTouch(){touch.left=touch.right=touch.jump=false;for(const k of ptr.values())if(k)touch[k]=true;keys.left=touch.left||keyHeld.left;keys.right=touch.right||keyHeld.right;const was=keys.jump;keys.jump=touch.jump||keyHeld.jump;if(keys.jump&&!was)keys.jumpPressed=true}
const keyHeld={left:false,right:false,jump:false};addEventListener('keydown',e=>{let used=true;if(['ArrowLeft','a','A'].includes(e.key))keyHeld.left=true;else if(['ArrowRight','d','D'].includes(e.key))keyHeld.right=true;else if(['ArrowUp','w','W',' '].includes(e.key)){if(!keyHeld.jump)keys.jumpPressed=true;keyHeld.jump=true}else used=false;if(used)e.preventDefault();keys.left=touch.left||keyHeld.left;keys.right=touch.right||keyHeld.right;keys.jump=touch.jump||keyHeld.jump},{passive:false});addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))keyHeld.left=false;if(['ArrowRight','d','D'].includes(e.key))keyHeld.right=false;if(['ArrowUp','w','W',' '].includes(e.key))keyHeld.jump=false;keys.left=touch.left||keyHeld.left;keys.right=touch.right||keyHeld.right;keys.jump=touch.jump||keyHeld.jump});
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture?.(e.pointerId);ptr.set(e.pointerId,controlAt(e.clientX,e.clientY));syncTouch();e.preventDefault()},{passive:false});cv.addEventListener('pointermove',e=>{if(ptr.has(e.pointerId)){ptr.set(e.pointerId,controlAt(e.clientX,e.clientY));syncTouch();e.preventDefault()}},{passive:false});function release(e){ptr.delete(e.pointerId);syncTouch();e.preventDefault()}cv.addEventListener('pointerup',release,{passive:false});cv.addEventListener('pointercancel',release,{passive:false});
function loading(){ctx.fillStyle='#102b4b';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='900 22px Arial';ctx.textAlign='center';ctx.fillText(`Загрузка спрайтов ${assetsReady}/${Object.keys(A).length}`,W/2,H/2)}
function loop(now){if(!last)last=now;let dt=Math.min(.05,(now-last)/1000);last=now;if(assetsReady<Object.keys(A).length){loading();requestAnimationFrame(loop);return}acc+=dt;while(acc>=STEP){update(STEP);acc-=STEP}if(state==='play')drawWorld();else{ctx.fillStyle='#132b4a';ctx.fillRect(0,0,W,H)}requestAnimationFrame(loop)}requestAnimationFrame(loop);
startBtn.onclick=startGame;restartBtn.onclick=startGame;
