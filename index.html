<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>Night Hunt</title>
<script src="/sdk.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08060f;color:#ddd;font-family:monospace;touch-action:none;overscroll-behavior:none;user-select:none}body{display:grid;place-items:center}#boot{text-align:center;line-height:1.7}.bar{width:min(420px,75vw);height:8px;background:#211a35;margin:18px auto;overflow:hidden}.bar i{display:block;height:100%;width:35%;background:#8064c9;animation:a 1s infinite alternate}@keyframes a{to{transform:translateX(185%)}}small{opacity:.65}
</style>
</head>
<body>
<div id="boot"><b>НОВАЯ ИГРА</b><div class="bar"><i></i></div><small>Подготавливаем новую основу для Яндекс Игр…</small></div>
<script src="./yandex-bridge.js"></script>
<script>
(async()=>{
 await YandexBridge.init();
 // The old Skybound/Steel & Souls bootstrap is intentionally gone.
 // This page is now the clean entry point for the new Moonfang-derived game.
 const boot=document.getElementById('boot');
 boot.innerHTML='<b>NIGHT HUNT</b><br><small>Новая игровая основа устанавливается. Старый проект отключён.</small>';
 YandexBridge.ready();
})();
</script>
</body>
</html>
